<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>庫存管理系統</title>
  <link rel="icon" type="image/png" href="/app/icon.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    @media (prefers-color-scheme: dark) { html, body { background: #1a1b1e; } }
    #f { border: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <!--
    App 外框：以同源 iframe 載入 InvenTree，並把中文操作助手注入每個頁面，
    使用者不需要另外安裝 Tampermonkey。網址的 # 後面記住目前頁面，重新整理會停在原處。
  -->
  <iframe id="f" title="庫存管理系統"></iframe>
  <script>
    (function () {
      // 若外框本身被載入到 iframe 裡（例如登出後導回 /），直接改顯示 InvenTree，避免套娃
      if (window.top !== window.self) { location.replace('/web/'); return; }

      var HELPER = '/app/inventree-ui-helper.user.js';
      var f = document.getElementById('f');
      var start = location.hash.indexOf('#/') === 0 ? location.hash.slice(1) : '/web/';
      f.src = start;

      function inject() {
        try {
          var w = f.contentWindow, d = f.contentDocument;
          if (!d || !d.head || w.__ithLoaded || d.getElementById('ith-helper')) return;
          var s = d.createElement('script');
          s.id = 'ith-helper';
          s.src = HELPER;
          d.head.appendChild(s);
        } catch (e) {
          console.warn('無法載入中文操作助手：', e);
        }
      }
      f.addEventListener('load', inject);

      // 同步標題與目前頁面路徑（InvenTree 是單頁應用，換頁不會觸發 load）
      setInterval(function () {
        try {
          var loc = f.contentWindow.location;
          var path = loc.pathname + loc.search + loc.hash;
          if (path && path !== 'blank' && ('#' + path) !== location.hash) {
            history.replaceState(null, '', '#' + path);
          }
          var t = f.contentDocument && f.contentDocument.title;
          document.title = t ? t + '｜庫存管理系統' : '庫存管理系統';
          inject();
        } catch (e) { /* 載入中 */ }
      }, 1000);
    })();
  </script>
</body>
</html>
