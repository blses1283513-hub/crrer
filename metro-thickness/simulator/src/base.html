<title>DRAM Metro Simulator</title>
<style>/* DRAM Metro Simulator — design tokens (from DRAM Operation Atlas) + layout. */

  :root{
    --bg:#EFF1F3;
    --surface:#FFFFFF;
    --surface-2:#E4E7EB;
    --surface-3:#F6F7F9;
    --text:#14171C;
    --text-dim:#59616E;
    --text-faint:#858D9A;
    --border:#CFD4DB;
    --border-soft:#E2E6EA;
    --accent:#2A5D7C;
    --accent-soft:#2A5D7C14;

    --elec:#2F6FB0;
    --sig:#B5555B;
    --leak:#C2622E;
    --ok:#3F7A52;

    --m-si:#C3C9D6;    --m-si-ln:#7A8397;
    --m-ox:#8CC8D9;    --m-ox-ln:#3E7E93;
    --m-nit:#A3C99B;   --m-nit-ln:#4F7D47;
    --m-poly:#BCA6D8;  --m-poly-ln:#6E5596;
    --m-met:#ADB3BD;   --m-met-ln:#6B727E;
    --m-met2:#8E949E;
    --m-hik:#E9C46A;   --m-hik-ln:#A8842A;
    --m-cu:#E08E5A;    --m-cu-ln:#A85F2E;
    --m-dop:#E39190;   --m-dop-ln:#A65150;

    --shadow:0 1px 2px rgba(16,20,26,.05), 0 6px 20px rgba(16,20,26,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0F1216; --surface:#171B21; --surface-2:#1F242B; --surface-3:#13171C;
      --text:#E6E9ED; --text-dim:#98A2B0; --text-faint:#6E7886;
      --border:#2C333C; --border-soft:#242A32;
      --accent:#6FB4D8; --accent-soft:#6FB4D81F;

      --elec:#7FB6E8;
      --sig:#E39190;
      --leak:#E3A06A;
      --ok:#77BC8E;

      --m-si:#4A5364;    --m-si-ln:#8D97A8;
      --m-ox:#3F7F94;    --m-ox-ln:#8FCEE0;
      --m-nit:#4E7C47;   --m-nit-ln:#9FCB97;
      --m-poly:#6B5194;  --m-poly-ln:#BFA9DB;
      --m-met:#6A717D;   --m-met-ln:#B2B8C2;
      --m-met2:#878E99;
      --m-hik:#A8842A;   --m-hik-ln:#EBCA79;
      --m-cu:#A25C2C;    --m-cu-ln:#E39A6A;
      --m-dop:#A85455;   --m-dop-ln:#E79695;

      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 26px rgba(0,0,0,.42);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0F1216; --surface:#171B21; --surface-2:#1F242B; --surface-3:#13171C;
    --text:#E6E9ED; --text-dim:#98A2B0; --text-faint:#6E7886;
    --border:#2C333C; --border-soft:#242A32;
    --accent:#6FB4D8; --accent-soft:#6FB4D81F;
    --elec:#7FB6E8; --sig:#E39190; --leak:#E3A06A; --ok:#77BC8E;
    --m-si:#4A5364;    --m-si-ln:#8D97A8;
    --m-ox:#3F7F94;    --m-ox-ln:#8FCEE0;
    --m-nit:#4E7C47;   --m-nit-ln:#9FCB97;
    --m-poly:#6B5194;  --m-poly-ln:#BFA9DB;
    --m-met:#6A717D;   --m-met-ln:#B2B8C2;
    --m-met2:#878E99;
    --m-hik:#A8842A;   --m-hik-ln:#EBCA79;
    --m-cu:#A25C2C;    --m-cu-ln:#E39A6A;
    --m-dop:#A85455;   --m-dop-ln:#E79695;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 26px rgba(0,0,0,.42);
  }

  
  /* ---------- DRAM Metro Simulator layout (tokens above copied from DRAM Operation Atlas) ---------- */
  :root{ --ff:'Microsoft JhengHei','PingFang TC','Noto Sans TC',-apple-system,'Segoe UI',sans-serif;
         --fm:Consolas,'JetBrains Mono','Cascadia Mono',ui-monospace,monospace;
         --good:var(--ok); --bad:var(--sig); }
  *{box-sizing:border-box;}
  body{margin:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--ff);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1200px;margin:0 auto;padding:0 16px;}
  main.wrap{display:flex;flex-direction:column;gap:22px;padding-bottom:60px;}
  h1,h2,h3{font-weight:700;line-height:1.3;}
  .en{font-family:var(--fm);font-size:.72em;color:var(--text-faint);font-weight:400;}
  .mono{font-family:var(--fm);}

  #banner{position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;background:color-mix(in srgb,var(--leak) 18%,var(--surface));border-bottom:1px solid var(--leak);
    color:var(--text);padding:7px 16px;font-size:.86rem;text-align:center;font-weight:700;}
  .masthead{padding-top:22px;padding-bottom:10px;}
  .masthead h1{font-size:1.55rem;margin:0 0 6px;text-wrap:balance;}
  .masthead .lede{margin:0 0 12px;color:var(--text-dim);max-width:78ch;font-size:.92rem;}
  #controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  select,button,input[type=number]{font:inherit;font-size:.85rem;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:5px 9px;}
  button{cursor:pointer;}
  button:hover{border-color:var(--accent);}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  button.on{background:var(--accent);color:var(--surface);border-color:var(--accent);}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:3px;overflow:hidden;}
  .seg button{border:none;border-radius:0;border-right:1px solid var(--border);}
  .seg button:last-child{border-right:none;}
  .note{font-size:.8rem;color:var(--text-faint);}

  /* causal chain */
  #chain{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--surface-2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);box-shadow:var(--shadow);margin-bottom:18px;}
  body.has-banner #chain{top:calc(36px + env(safe-area-inset-top, 0px));}
  .chain{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:0;max-width:1200px;margin:0 auto;}
  .cc{padding:7px 12px;border-left:1px solid var(--border);min-width:0;}
  .cc:first-child{border-left:none;}
  .cc .k{display:block;font-size:.68rem;color:var(--text-faint);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cc .v{font-family:var(--fm);font-size:.95rem;font-weight:700;white-space:nowrap;}
  .cc .u{font-family:var(--fm);font-size:.7rem;color:var(--text-dim);margin-left:3px;}
  .cc .d{display:block;font-family:var(--fm);font-size:.72rem;min-height:1em;}
  .cc .d.bad{color:var(--bad);} .cc .d.good{color:var(--good);}
  .cc.alarm{background:color-mix(in srgb,var(--sig) 14%,transparent);}
  .cc.alarm .v{color:var(--sig);font-size:.8rem;white-space:normal;}

  [hidden]{display:none !important;}
  /* panels */
  .panel{scroll-margin-top:96px;background:var(--surface);border:1px solid var(--border);border-radius:4px;box-shadow:var(--shadow);padding:18px 20px;}
  .panel > h2{font-size:1.18rem;margin:0 0 4px;}
  .panel > .sub{margin:0 0 14px;color:var(--text-dim);font-size:.88rem;max-width:90ch;}
  .grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;}
  .grid-m6{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:18px;}
  @media (max-width:900px){ .grid2,.grid-m6{grid-template-columns:minmax(0,1fr);} }
  .card{background:var(--surface-3);border:1px solid var(--border-soft);border-radius:3px;padding:12px 14px;}
  .card h3{font-size:.95rem;margin:0 0 8px;}
  .card + .card{margin-top:12px;}
  .warn{border-left:3px solid var(--sig);background:color-mix(in srgb,var(--sig) 9%,transparent);padding:8px 12px;border-radius:0 3px 3px 0;font-size:.85rem;margin:10px 0;}
  .info{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 3px 3px 0;font-size:.85rem;margin:10px 0;}
  h4.grp{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);font-family:var(--fm);margin:4px 0 6px;font-weight:500;}

  /* sliders */
  .slider{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"lab num" "rng rng";gap:0 10px;padding:6px 0;border-bottom:1px dashed var(--border-soft);}
  .slider .lab{grid-area:lab;font-size:.84rem;}
  .slider .num{grid-area:num;font-family:var(--fm);font-size:.82rem;white-space:nowrap;}
  .slider .unit{color:var(--text-faint);font-size:.75rem;}
  .slider input[type=range]{grid-area:rng;width:100%;accent-color:var(--accent);margin:4px 0 0;}
  .slider.ro{opacity:.8;grid-template-areas:"lab num";}
  .slider.ro .lab::after{content:'（固定值）';font-size:.72rem;color:var(--text-faint);margin-left:4px;}
  .badge{display:inline-block;font-size:.72rem;line-height:1;margin-left:2px;cursor:help;vertical-align:1px;}
  .badge.t-derived{font-size:.64rem;border:1px solid var(--border);border-radius:2px;padding:1px 3px;color:var(--text-dim);font-family:var(--fm);}

  /* readouts */
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
  .kv > div{background:var(--surface-3);border:1px solid var(--border-soft);border-radius:3px;padding:7px 10px;}
  .kv .k{display:block;font-size:.72rem;color:var(--text-faint);}
  .kv .v{font-family:var(--fm);font-weight:700;font-size:.95rem;}
  .kv .v2{display:block;font-family:var(--fm);font-size:.74rem;color:var(--sig);}
  svg{display:block;width:100%;height:auto;}
  .figcap{font-size:.8rem;color:var(--text-faint);margin:6px 0 0;}
  details{margin-top:12px;}
  details summary{cursor:pointer;font-size:.86rem;color:var(--accent);}
  table.f{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:8px;}
  table.f td,table.f th{border-bottom:1px solid var(--border-soft);padding:5px 7px;text-align:left;vertical-align:top;}
  table.f td.m{font-family:var(--fm);}

  /* M6 */
  .mlist{display:flex;flex-direction:column;gap:6px;}
  .mlist button{text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 10px;}
  .mlist button .mz{font-size:.86rem;}
  .chip{font-size:.66rem;border:1px solid currentColor;border-radius:2px;padding:1px 5px;white-space:nowrap;font-family:var(--fm);}
  .chip.quant{color:var(--ok);} .chip.semi{color:var(--leak);} .chip.qual{color:var(--text-faint);}
  .band{white-space:nowrap;display:inline-block;font-weight:700;padding:1px 6px;border-radius:2px;color:var(--surface);font-family:var(--fm);font-size:.78rem;}
  .band.good{background:var(--ok);} .band.marginal{background:var(--leak);} .band.reject{background:var(--sig);} .band.na{background:var(--text-faint);}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0;}
  .row label{font-size:.84rem;display:inline-flex;gap:6px;align-items:center;}
  .row input[type=number]{width:96px;font-family:var(--fm);}
  .scen{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}

  /* M2 */
  .m2-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;}
  @media (max-width:900px){ .m2-grid{grid-template-columns:minmax(0,1fr);} }
  .m2-tgt{cursor:pointer;}
  @media (max-width:700px){ .svgscroll{overflow-x:auto;} .svgscroll svg{min-width:620px;} }
  .m2-tgt.hl > *{stroke:var(--sig) !important;stroke-width:2.6 !important;}
  ol.corr{margin:0;padding-left:20px;font-size:.84rem;display:flex;flex-direction:column;gap:6px;}
  ol.corr .tc{font-family:var(--fm);font-size:.72rem;color:var(--text-faint);}
  footer.panel p{font-size:.84rem;color:var(--text-dim);margin:6px 0;}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }
</style>

<header class="wrap masthead">
  <h1>DRAM Metro Simulator：量測偏移 → 電子 → fail bit</h1>
  <p class="lede">一階物理模型＋製程變異層。預設值由公開資料推算（Micron 1β 級 16 Gb DDR5），每個參數標示來源等級（🟢 公開規格・🟡 Micron 逆向工程・🟠 他廠／通用文獻・🔴 查無公開資料）；所有數值可調。數量級示意，非任何公司規格。</p>
  <div id="controls"></div>
</header>
