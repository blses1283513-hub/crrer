# 妮菈 ERPNext 16 試用版：在真正的 ERPNext 上端對端測試
# 用與使用者相同的安裝腳本（install-erpnext-trial.ps1）安裝、匯入範例資料，再跑 13 項功能驗證與續裝。
name: 妮菈 ERPNext 試用版（端對端）

on:
  push:
    paths:
      - 'nila-erpnext/**'
      - 'tests/erpnext/**'
      - '.github/workflows/nila-erpnext-trial.yml'
  pull_request:
    paths:
      - 'nila-erpnext/**'
      - 'tests/erpnext/**'
      - '.github/workflows/nila-erpnext-trial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 騰出磁碟空間（ERPNext 映像約 7 GB）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: 安裝（install-erpnext-trial.ps1，密碼含 $ " 空白）
        shell: pwsh
        run: ./tests/erpnext/Run-TrialInstall.ps1 -InstallDir "$env:RUNNER_TEMP/trial"
      - name: 以設定的密碼登入
        run: |
          curl -sf -X POST http://localhost:8080/api/method/login -H 'Content-Type: application/json' \
            -d '{"usr":"Administrator","pwd":"Pa$$ \"w0rd x"}' | grep -q 'Logged In'
      - name: 13 項功能驗證（verify-erpnext-trial.ps1）
        shell: pwsh
        run: |
          $out = & ./nila-erpnext/verify-erpnext-trial.ps1 -InstallDir "$env:RUNNER_TEMP/trial" *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch '結果：13/13 項通過') { throw '驗證未全部通過' }
      - name: 續裝（再執行一次，不重複建立資料）
        shell: pwsh
        run: |
          $out = & ./tests/erpnext/Run-TrialInstall.ps1 -InstallDir "$env:RUNNER_TEMP/trial" -Resume *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch '本次新增 0 筆資料') { throw '續裝時重複建立了資料' }
      - name: 失敗時的紀錄
        if: failure()
        working-directory: ${{ runner.temp }}/trial
        run: docker compose ps -a; docker compose logs --tail 80 backend create-site
