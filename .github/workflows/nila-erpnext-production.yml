# 妮菈 ERPNext 16 正式版：在真正的 ERPNext 上端對端測試
# 用與使用者相同的腳本：install-nila.ps1（兩次：放設定檔、安裝）→ 商品功能整合測試 → backup-nila.ps1 → restore-nila.ps1 → update-nila.ps1
# upgrade：先裝 0.1.0（P0），再用 update-nila.ps1 更新到目前版本，確認舊客戶可以直接升級
name: 妮菈 ERPNext 正式版（端對端）

on:
  push:
    paths:
      - 'nila-erpnext/apps/**'
      - 'nila-erpnext/production/**'
      - 'tests/erpnext/**'
      - '.github/workflows/nila-erpnext-production.yml'
  pull_request:
    paths:
      - 'nila-erpnext/apps/**'
      - 'nila-erpnext/production/**'
      - 'tests/erpnext/**'
      - '.github/workflows/nila-erpnext-production.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  INSTALL: ${{ github.workspace }}/../nila-install
  ADMIN_PW: 'Prod $pw"2026x'
  VERSION: '0.8.0'
  P0_COMMIT: ab1df1e3a0a81f1d48bad5084c424040a4c6e699

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: 騰出磁碟空間（ERPNext 映像約 7 GB）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: 單元測試
        run: python3 -m unittest discover -s tests/erpnext -v
      - name: 安裝第一次（只放置設定檔）
        shell: pwsh
        run: |
          ./tests/erpnext/Invoke-WithAnswers.ps1 -Script ./nila-erpnext/production/install-nila.ps1 -InstallDir $env:INSTALL
          if (-not (Test-Path "$env:INSTALL/production/nila-config.json")) { throw '沒有放置設定檔' }
      - name: 安裝第二次（建置、建立網站、基本設定）
        shell: pwsh
        run: |
          $env:NILA_ANSWERS = "$env:ADMIN_PW`n$env:ADMIN_PW`nY"
          ./tests/erpnext/Invoke-WithAnswers.ps1 -Script ./nila-erpnext/production/install-nila.ps1 -InstallDir $env:INSTALL
          if ((Get-Content "$env:INSTALL/production/.env" -Raw) -notmatch "ADMIN_PASSWORD=''") { throw '.env 中仍有管理員密碼' }
      - name: 檢查安裝結果
        run: python3 tests/erpnext/check_production.py --password "$ADMIN_PW" --expect-version "$VERSION" --phase install
      - name: 商品功能整合測試（新增款式、同步、停售停產、匯入匯出）
        working-directory: ${{ env.INSTALL }}/production
        run: |
          docker compose cp "$GITHUB_WORKSPACE/tests/erpnext/live_products.py" backend:/tmp/live_products.py
          docker compose cp "$GITHUB_WORKSPACE/tests/erpnext/live_import.py" backend:/tmp/live_import.py
          docker compose cp "$GITHUB_WORKSPACE/nila-erpnext/seed/sample-skus.csv" backend:/tmp/sample-skus.csv
          docker compose exec -T backend bash -c "cd sites && ../env/bin/python -W ignore /tmp/live_products.py nila"
          docker compose exec -T backend bash -c "cd sites && ../env/bin/python -W ignore /tmp/live_import.py nila /tmp/sample-skus.csv"
      - name: 庫存表、全公司補貨、訂單調度整合測試（含 170 款 4,760 規格的速度測試）
        working-directory: ${{ env.INSTALL }}/production
        run: |
          docker compose cp "$GITHUB_WORKSPACE/tests/erpnext/live_stock.py" backend:/tmp/live_stock.py
          docker compose exec -T backend bash -c "cd sites && ../env/bin/python -W ignore /tmp/live_stock.py nila"
          docker compose exec -T backend bash -c "cd sites && ../env/bin/python -W ignore /tmp/live_stock.py nila 170"
      - name: 門市銷售與會員整合測試（含一年 20,000 筆銷售的速度測試）
        working-directory: ${{ env.INSTALL }}/production
        run: |
          docker compose cp "$GITHUB_WORKSPACE/tests/erpnext/live_retail.py" backend:/tmp/live_retail.py
          docker compose exec -T backend bash -c "cd sites && ../env/bin/python -W ignore /tmp/live_retail.py nila"
          docker compose exec -T backend bash -c "cd sites && ../env/bin/python -W ignore /tmp/live_retail.py nila 20000"
      - name: 帳號、5 個層級的權限、成本欄位、抽獎、SHOPLINE 整合測試
        working-directory: ${{ env.INSTALL }}/production
        run: |
          docker compose cp "$GITHUB_WORKSPACE/tests/erpnext/live_perms.py" backend:/tmp/live_perms.py
          docker compose exec -T backend bash -c "cd sites && ../env/bin/python -W ignore /tmp/live_perms.py nila"
          docker compose cp "$GITHUB_WORKSPACE/tests/erpnext/live_shopline.py" backend:/tmp/live_shopline.py
          docker compose exec -T backend bash -c "cd sites && ../env/bin/python -W ignore /tmp/live_shopline.py nila"
      - name: 備份（含第二個地方）
        shell: pwsh
        run: |
          ./tests/erpnext/Invoke-WithAnswers.ps1 -Script "$env:INSTALL/production/backup-nila.ps1" -OutDir "$env:RUNNER_TEMP/b1" -CopyTo "$env:RUNNER_TEMP/b2"
          if (@(Get-ChildItem "$env:RUNNER_TEMP/b1/*/*-database.sql.gz").Count -ne 1) { throw '沒有資料庫備份' }
          if (@(Get-ChildItem "$env:RUNNER_TEMP/b2/*/*-database.sql.gz").Count -ne 1) { throw '第二個地方沒有備份' }
      - name: 備份後修改資料
        run: python3 tests/erpnext/check_production.py --password "$ADMIN_PW" --phase mutate
      - name: 還原
        shell: pwsh
        run: |
          $env:NILA_ANSWERS = 'YES'
          $b = (Get-ChildItem "$env:RUNNER_TEMP/b1" -Directory | Select-Object -First 1).FullName
          ./tests/erpnext/Invoke-WithAnswers.ps1 -Script "$env:INSTALL/production/restore-nila.ps1" -BackupDir $b
      - name: 檢查還原結果
        run: python3 tests/erpnext/check_production.py --password "$ADMIN_PW" --phase restored
      - name: 更新到新版本（模擬 0.1.0 → 0.9.9）
        shell: pwsh
        run: |
          $dl = "$env:RUNNER_TEMP/download/nila-erpnext"
          New-Item -ItemType Directory -Force -Path $dl | Out-Null
          Copy-Item ./nila-erpnext/apps, ./nila-erpnext/production $dl -Recurse
          $init = "$dl/apps/nila_app/nila_app/__init__.py"
          (Get-Content $init -Raw) -replace '__version__ = ".*"', '__version__ = "0.9.9"' | Set-Content $init -NoNewline
          $env:NILA_ANSWERS = 'Y'
          ./tests/erpnext/Invoke-WithAnswers.ps1 -Script "$dl/production/update-nila.ps1" -InstallDir $env:INSTALL
      - name: 檢查更新結果
        run: python3 tests/erpnext/check_production.py --password "$ADMIN_PW" --expect-version 0.9.9 --phase restored
      - name: 失敗時的紀錄
        if: failure()
        working-directory: ${{ env.INSTALL }}/production
        run: docker compose ps -a; docker compose logs --tail 80 backend create-site frontend

  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: 取得 0.1.0（P0）的程式
        uses: actions/checkout@v4
        with:
          ref: ${{ env.P0_COMMIT }}
          path: old
      - name: 騰出磁碟空間（ERPNext 映像約 7 GB）
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: 安裝 0.1.0
        shell: pwsh
        run: |
          ./tests/erpnext/Invoke-WithAnswers.ps1 -Script ./old/nila-erpnext/production/install-nila.ps1 -InstallDir $env:INSTALL
          $env:NILA_ANSWERS = "$env:ADMIN_PW`n$env:ADMIN_PW`nY"
          ./tests/erpnext/Invoke-WithAnswers.ps1 -Script ./old/nila-erpnext/production/install-nila.ps1 -InstallDir $env:INSTALL
      - name: 檢查 0.1.0
        run: python3 tests/erpnext/check_production.py --password "$ADMIN_PW" --expect-version 0.1.0 --phase install --p0-only
      - name: 用 update-nila.ps1 更新到目前版本
        shell: pwsh
        run: |
          $dl = "$env:RUNNER_TEMP/download/nila-erpnext"
          New-Item -ItemType Directory -Force -Path $dl | Out-Null
          Copy-Item ./nila-erpnext/apps, ./nila-erpnext/production $dl -Recurse
          $env:NILA_ANSWERS = 'Y'
          ./tests/erpnext/Invoke-WithAnswers.ps1 -Script "$dl/production/update-nila.ps1" -InstallDir $env:INSTALL
      - name: 檢查更新結果（資料保留、新功能生效）
        run: python3 tests/erpnext/check_production.py --password "$ADMIN_PW" --expect-version "$VERSION" --phase restored
      - name: 商品功能整合測試
        working-directory: ${{ env.INSTALL }}/production
        run: |
          docker compose cp "$GITHUB_WORKSPACE/tests/erpnext/live_products.py" backend:/tmp/live_products.py
          docker compose exec -T backend bash -c "cd sites && ../env/bin/python -W ignore /tmp/live_products.py nila"
          docker compose cp "$GITHUB_WORKSPACE/tests/erpnext/live_stock.py" backend:/tmp/live_stock.py
          docker compose exec -T backend bash -c "cd sites && ../env/bin/python -W ignore /tmp/live_stock.py nila"
          docker compose cp "$GITHUB_WORKSPACE/tests/erpnext/live_retail.py" backend:/tmp/live_retail.py
          docker compose exec -T backend bash -c "cd sites && ../env/bin/python -W ignore /tmp/live_retail.py nila"
          docker compose cp "$GITHUB_WORKSPACE/tests/erpnext/live_perms.py" backend:/tmp/live_perms.py
          docker compose exec -T backend bash -c "cd sites && ../env/bin/python -W ignore /tmp/live_perms.py nila"
          docker compose cp "$GITHUB_WORKSPACE/tests/erpnext/live_shopline.py" backend:/tmp/live_shopline.py
          docker compose exec -T backend bash -c "cd sites && ../env/bin/python -W ignore /tmp/live_shopline.py nila"
      - name: 失敗時的紀錄
        if: failure()
        working-directory: ${{ env.INSTALL }}/production
        run: docker compose ps -a; docker compose logs --tail 80 backend create-site frontend
