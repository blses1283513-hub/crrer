# Firefly III 家用部署（電腦 / NAS）
# 改寫自官方 https://github.com/firefly-iii/docker 的 docker-compose.yml，加入 Data Importer。
# 使用前：複製三個 *.example 檔並填入密碼，詳見 README.md。
services:
  app:
    image: fireflyiii/core:latest
    hostname: app
    container_name: firefly_iii_core
    restart: always
    volumes:
      - firefly_iii_upload:/var/www/html/storage/upload
    env_file: .env
    networks:
      - firefly_iii
    ports:
      - 8080:8080    # 瀏覽器開 http://<主機IP>:8080
    depends_on:
      - db

  db:
    image: mariadb:lts
    hostname: db
    container_name: firefly_iii_db
    restart: always
    env_file: .db.env
    networks:
      - firefly_iii
    volumes:
      - firefly_iii_db:/var/lib/mysql

  importer:
    image: fireflyiii/data-importer:latest
    hostname: importer
    container_name: firefly_iii_importer
    restart: always
    env_file: .importer.env
    networks:
      - firefly_iii
    ports:
      - 8081:8080    # 匯入工具 http://<主機IP>:8081
    depends_on:
      - app

  cron:
    # 每天 03:00 觸發定期交易、帳單檢查等排程。
    # STATIC_CRON_TOKEN 必須在 .env 中設定，且剛好 32 個字元。
    image: alpine
    restart: always
    container_name: firefly_iii_cron
    env_file: .env
    command: ["sh", "-c", "apk add tzdata && \
      (ln -s /usr/share/zoneinfo/$$TZ /etc/localtime || true) && \
      echo \"0 3 * * * wget -qO- http://app:8080/api/v1/cron/$$STATIC_CRON_TOKEN;echo\" \
      | crontab - && \
      crond -f -L /dev/stdout"]
    networks:
      - firefly_iii
    depends_on:
      - app

volumes:
  firefly_iii_upload:
  firefly_iii_db:

networks:
  firefly_iii:
    driver: bridge
