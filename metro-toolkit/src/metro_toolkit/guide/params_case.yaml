# Controls of the Case study page.

params:
  case.domain:
    zh: |
      **範圍 Domain**：只從某一類工作抽案例（SPC、晶圓圖、膜厚擬合、MSA、量測技術評估、DOE、良率事件），或「全部」隨機。
      想加強某個弱項時固定範圍；模擬真實值班時用「全部」，因為現場不會先告訴你是哪一類問題。
      新增的範圍：**Inline defect 缺陷檢查**（檢查數量、review、split vs baseline）與 **跨部門請求**（FA、YE 請量測確認時怎麼用資料回答）；有自己的範本時會多一個「我的案例」。
      「🎯 針對我的弱點」：依你存過的練習紀錄出題，近期分數低的題型與範圍最常出、沒練過的其次、已經很熟的很少出；難度也會跟著你最近的分數升降（≥85 升一級、<50 降一級）。
    en: |
      **Domain**: draw cases from one area of the job only (SPC, wafer map, film fit, MSA, technique choice, DOE, yield events), or from all of them.
      Fix the domain to drill a weak spot; use "all" to simulate a real shift, where nobody tells you in advance what kind of problem it is.
      Newer areas: **Inline defect inspection** (counts, review, split vs baseline) and **Cross-role requests** (answering FA / YE requests with metrology data); "My cases" appears once you have your own templates.
      "🎯 My weak spots" picks from your saved study log: case types and areas with low recent scores come up most, types you have not tried next, ones you have mastered rarely; the level follows your recent score too (>= 85 one level up, < 50 one level down).
  case.level:
    zh: |
      **難度 Level**
      - **基礎 basic**：訊號大、線索清楚，適合先學判斷流程。
      - **中級 intermediate**：訊號較小，有時交接內容會說「量測已確認」，第一步處置就要跟著改。
      - **進階 advanced**：訊號接近雜訊、線索較少，需要從圖上自己找證據；也會出現「看起來嚴重其實不用處理」的情況。
      隨機：每次抽一種難度。
    en: |
      **Level**
      - **basic**: large signal and clear clues; good for learning the decision flow.
      - **intermediate**: smaller signals; sometimes the handover says metrology was already verified, and then the right first action changes.
      - **advanced**: signals close to the noise and fewer clues, so you must find the evidence on the charts yourself; also includes situations that look serious but need no action.
      Random picks a level each time.
  case.new:
    zh: |
      **🎲 隨機案例**：依範圍與難度抽一個案例：案例類型、機台／chamber、事件大小、發生時間與雜訊都是隨機的，但物理與統計都合理，而且一定有一個正確答案。
      每個案例都有編號，可以之後用編號重練同一題。
    en: |
      **🎲 Random case**: draws a case for the chosen domain and level. Case type, tool / chamber, event size, timing and noise are random, but the physics and statistics stay realistic and there is always one correct answer.
      Every case has an ID so you can replay exactly the same case later.
  case.replay:
    zh: "**案例編號 Case ID**：格式「案例類型-難度-種子」，例如 spc_chamber_shift-I-04217（B 基礎／I 中級／A 進階）。同一個編號永遠產生同一個案例，可以重練或分享給同事一起練。"
    en: "**Case ID**: format \"case type-level-seed\", e.g. spc_chamber_shift-I-04217 (B basic / I intermediate / A advanced). The same ID always regenerates the same case, so you can replay it or share it with a colleague."
  case.q_cause:
    zh: "**根本原因**：根據交接內容與圖上的證據，選最可能的原因。先問「影響範圍」：一個 chamber 還是全部？只有平均值還是形狀？只有量測值還是良率也變？這通常就能分出製程、機台或量測問題。"
    en: "**Root cause**: pick the most likely cause from the handover and the evidence. Start with the scope: one chamber or all of them? The mean or the shape? Only the readings, or yield too? That usually separates process, tool and metrology problems."
  case.q_action:
    zh: "**第一步處置**：你現在第一件要做的事。OCAP 的原則是先確認量測，再動製程；但如果交接已經說量測確認過，就直接進入下一步。不要過度反應：單點、在規格內的趨勢，通常不需要停機。"
    en: "**First action**: the first thing you would do now. The OCAP principle is to verify the measurement before touching the process, but if the handover says it was already verified, go to the next step. Do not over-react: a single point or an in-spec trend usually needs no tool-down."
  case.q_decision:
    zh: "**產品／結論處置**：受影響的產品或結果要怎麼辦（hold、放行、重測後放行、調 target、recipe 不能發行…）。報廢幾乎不會是第一個決定，disposition 由 PIE／PE 依資料決定。"
    en: "**Disposition / decision**: what happens to the affected product or result (hold, release, release after re-measurement, re-target, recipe not ready…). Scrap is almost never the first decision; PIE / PE disposition on data."
  case.q_notify:
    zh: "**要通知誰**：選需要知道並採取行動的角色。通知太少會延誤處理，通知太多會造成噪音、降低大家對警報的信任。單點、已確認的偶發事件通常只要記在 e-log，不需升級。"
    en: "**Who to notify**: pick the roles that need to know and act. Too few delays the response; too many creates noise and erodes trust in alerts. A single, verified one-off usually goes in the e-log only, with no escalation."
  case.message:
    zh: "**你的訊息**：寫給指定角色的一則訊息（像 Teams／郵件／交接）。好訊息要具體：哪台、從什麼時候、多大、你的判斷、你要對方做什麼、你已經做了什麼。送出後會和範例比對要點。"
    en: "**Your message**: one message to the named role (as in chat / email / handover). A good message is specific: which tool, since when, how big, your judgement, what you need from them, and what you have already done. After submitting it is checked against the key points of a model message."
  case.submit:
    zh: "**送出**：計分（原因 40、第一步 25、處置 20、通知 15 分；通知依重疊比例給分），並顯示標準答案、理由、範例訊息與每張圖的完整讀圖說明。"
    en: "**Submit**: scores your answers (cause 40, first action 25, disposition 20, notify 15, with partial credit for overlap) and shows the model answers, the reasoning, model messages and the full reading of every chart."
  case.score:
    zh: "**總分**：原因 40 + 第一步 25 + 處置 20 + 通知 15。訊息不計分，但會列出涵蓋了哪些要點。分數是練習的回饋，不代表真實工作的唯一正確做法。"
    en: "**Score**: cause 40 + first action 25 + disposition 20 + notify 15. The message is not scored, but the key points it covers are listed. The score is practice feedback, not the only right way to handle real work."
  case.save:
    zh: "**存到練習紀錄**：把這次作答的完整報告（Markdown）存到這台電腦的 data/cases/（不會上傳 GitHub）。每次作答各存一個檔（案例編號＋日期時間），不會覆蓋舊的。報告包含：你的答案與標準答案、理由、範例訊息、好訊息的要點、分數紀錄，以及每張圖的洞察、下一步與給各角色的訊息。語言跟著側欄的說明語言。"
    en: "**Save to my study log**: saves the full report of this attempt (Markdown) to data/cases/ on this PC (never uploaded to GitHub). Every attempt gets its own file (case ID + date-time), so nothing is overwritten. The report has your answers vs the model answers, the reasoning, the model message, what a good message covers, your score history, and for every chart the insight, the next step and a message for every role. Its language follows the sidebar Guide language."
  case.fu_note:
    zh: "**我原本以為…**：寫下你答錯時心裡的理由（例如「我以為所有 chamber 一起偏就是 recipe 改了」）。存檔時會寫進這次的報告與練習紀錄；「我的案例報告 → 交叉分析」會列出你的誤解筆記，以及重練後有沒有改善。只存在這台電腦。"
    en: "**What I thought**: write down the reasoning behind your wrong answer (e.g. \"I thought all chambers moving meant a recipe change\"). Saving puts it in this attempt's report and your study log; My case reports → Cross study lists your misunderstanding notes and whether the retry went better. Stays on this PC."
  case.fu_retry:
    zh: "**換一組數字再練一次**：同一種案例、同樣難度、新的隨機數字（有時結果也不同），用來確認誤解已經釐清。新案例會記錄它是重練哪一題，交叉分析會比較前後分數。"
    en: "**Try a similar case**: the same case type and level with new random numbers (sometimes a different outcome), to check the misunderstanding is cleared. The new case records which attempt it retries, and the cross study compares the scores."
  case.tutor_key:
    zh: "**Anthropic API key**（選填）：如果電腦已設定 ANTHROPIC_API_KEY 或用 `ant auth login` 登入，就不用填。填在這裡的金鑰只存在這次瀏覽器工作階段，不會寫進任何檔案；關掉頁面就不見。"
    en: "**Anthropic API key** (optional): not needed if ANTHROPIC_API_KEY is set or you signed in with `ant auth login`. A key typed here is kept only for this browser session and is never written to any file; it is gone when you close the page."
  case.tutor_ask:
    zh: "**送出問題**：把你的問題連同這一題的資料（合成練習資料）、你的答案與講評送給 Claude（claude-haiku-5-5，快速、低成本的模型），回答會即時顯示。若 Claude 婉拒回答，會顯示提示請你換個方式問。每個問題都會用到 API 額度。看起來像公司機密的問題不會送出。存檔時對話會寫進報告。"
    en: "**Ask**: sends your question with this case's data (synthetic practice data), your answers and the comments to Claude (claude-haiku-5-5, a fast, low-cost model); the answer streams in. If Claude declines, you are asked to rephrase. Every question uses API credit. A question that looks company-confidential is not sent. Saving puts the conversation in the report."
  case.download:
    zh: "**下載報告**：下載和「存到練習紀錄」相同內容的 Markdown 報告，可以貼到筆記或和同事討論。"
    en: "**Download report**: downloads the same Markdown report that Save writes, for your notes or to discuss with colleagues."
  case.focus:
    zh: "**練習我的弱點**：依交叉分析的結果抽一題（近期分數低的題型與範圍最常出），直接帶你到 Case study 頁作答。"
    en: "**Practise my weak spots**: draws a case from the cross study (low-scoring case types and areas most often) and takes you to the Case study page to answer it."
  reports.filter:
    zh: "**篩選**：依範圍、難度、分數區間縮小報告清單；不選代表全部。"
    en: "**Filter**: narrow the report list by area, level and score range; leave empty for all."
  reports.search:
    zh: "**搜尋報告內容**：在所有報告的全文裡找字（不分大小寫），例如機台名 RTP02、inhibit、Cpk、某個角色。"
    en: "**Search**: finds text anywhere in the reports (not case-sensitive), e.g. a tool name like RTP02, inhibit, Cpk or a role."
  reports.open:
    zh: "**打開報告**：選一份報告在下面完整顯示，可下載成 .md。"
    en: "**Open a report**: pick one to show it in full below; it can be downloaded as .md."
  reports.retry:
    zh: "**重練這一題**：用同一個案例編號（同樣的數據）回到 Case study 頁重做一次，比較前後分數。"
    en: "**Retry this case**: opens the same case ID (same data) on the Case study page so you can redo it and compare scores."
  case.mix:
    zh: "**🎲🎲 多重問題**：一次產生 2–3 個問題。可能是**連動**（同一段製程資料裡同時發生，會互相遮蓋，例如量測機台偏差蓋住真正的 chamber 偏移），也可能是**獨立**（同一次交接裡不相關的幾件事）。除了原因與處置，還要判斷**先處理哪一個**。難度選「隨機」時也會隨機。"
    en: "**🎲🎲 Multi-issue**: makes 2–3 problems at once, either **linked** (happening together in the same fab data and able to hide each other, e.g. a metrology-tool offset over a real chamber shift) or **separate** (unrelated items in one shift handover). Besides causes and actions you decide **what to handle first**. With the level on random, the level is random too."
  case.q_causes:
    zh: "**有哪些原因（可複選）**：多重問題可能同時有好幾個原因。全部選對才拿滿分；漏選或多選會依重疊比例扣分。"
    en: "**Which causes are present (select all)**: a multi-issue case can have several causes at once. Full points only for the exact set; missing or extra choices cost points by overlap."
  case.q_priority:
    zh: "**先處理哪一個**：產品正在受影響的先止血（hold／隔離），其次是今天要處理但沒有立即風險的，最後是可以排程的。"
    en: "**Handle first**: contain whatever puts product at risk now (hold / isolate) first, then what needs action today without immediate risk, then what can be scheduled."
  case.builder_mode:
    zh: "**類型**：**連動**＝1–3 個問題放進同一次 fab 模擬（同一批 SPC、良率與 die map，可能互相遮蓋）；**獨立**＝2–3 個不相關的案例放進同一次交接，練習排先後。"
    en: "**Mode**: **linked** = 1–3 issues in one fab simulation (the same SPC, yield and die maps; they can hide each other); **separate** = 2–3 unrelated cases in one handover, to practise priorities."
  case.builder_n:
    zh: "**問題數**：連動案例要放幾個問題（1–3）。只有 1 個時就是單一問題，但你可以自己決定製程站、位置、大小與時間。"
    en: "**Issues**: how many issues the linked case has (1–3). With 1 it is a single issue, but you choose the step, place, size and timing."
  case.builder_kind:
    zh: "**問題種類**：單一 chamber 偏移、慢漂移、均勻度變差、所有 chamber 一起偏（recipe／進料）、量測機台偏差、外圈微粒、中心區缺陷。"
    en: "**Issue kind**: one-chamber shift, slow drift, worse uniformity, all chambers moved (recipe / incoming), metrology-tool offset, edge-ring particles, centre defects."
  case.builder_step:
    zh: "**製程站**：問題發生在哪一站（決定參數、單位、規格與元件窗口）。缺陷類問題固定在 inline 檢查站。"
    en: "**Step**: where the issue happens (sets the parameter, unit, spec and device window). Defect issues sit at the inline-inspection step."
  case.builder_where:
    zh: "**位置**：哪個 chamber／機台／量測機台；「all」代表所有機台一起。"
    en: "**Where**: which chamber / tool / metrology tool; \"all\" means every tool at once."
  case.builder_size:
    zh: "**大小**：訊號大小。參數類以該站的晶圓間 σ 為單位（小 ≈ 1.8σ、中 ≈ 2.8σ、大 ≈ 3.8σ）；缺陷類是缺陷密度倍數。小的訊號比較難看出來，也可能不影響良率。"
    en: "**Size**: signal size. Parameter issues are in the step's wafer-to-wafer σ (small ≈ 1.8σ, medium ≈ 2.8σ, large ≈ 3.8σ); defect issues are a defect-density multiplier. Small signals are harder to see and may not cost yield."
  case.builder_start:
    zh: "**開始批**：問題從第幾批開始（批序號，D0001 起算）。不同問題錯開時間，比較容易分辨；同時開始就比較難。"
    en: "**Start lot**: the lot index where the issue begins (D0001 = index 0). Staggered starts are easier to tell apart; simultaneous starts are harder."
  case.builder_types:
    zh: "**選案例類型**：獨立模式要放進同一次交接的 2–3 個案例（建議選不同範圍，例如 SPC＋MSA＋缺陷）。"
    en: "**Case types**: the 2–3 cases put in one handover in separate mode (different areas work best, e.g. SPC + MSA + defect)."
  case.builder_build:
    zh: "**建立案例**：依你的設定產生案例，設定存在這台電腦的 data/cases/built/，案例編號（build_…）可以重練。"
    en: "**Build case**: generates the case from your settings; the settings are saved on this PC in data/cases/built/, and the case ID (build_…) replays it."
  case.tpl_pick:
    zh: "**範本**：選「新範本」寫一個新的，或選已存的範本來修改、練習或刪除。範本只存在這台電腦。"
    en: "**Template**: pick \"new template\" to write one, or a saved template to edit, practise or delete it. Templates live on this PC only."
  case.tpl_base:
    zh: "**資料模式**：範本的圖表與數值來自哪一個內建案例類型。下方列出你可以在文字裡引用的 {名稱} 與範例值。"
    en: "**Data pattern**: which built-in case type draws the template's charts and values. The {names} you can quote in your texts are listed below with example values."
  case.tpl_text:
    zh: "**文字**：中文或英文寫一種就好，另一種會自動沿用。可以用 {名稱} 引用資料模式裡的數值（例如 {chamber}、{shift}）；換行會保留。"
    en: "**Text**: one language is enough; the other copies it. Quote values from the data pattern with {names} (e.g. {chamber}, {shift}); line breaks are kept."
  case.tpl_answer:
    zh: "**正確答案**：從選項庫選一個，或選「我自己寫」輸入你自己的答案文字（中／英）。"
    en: "**Right answer**: pick one from the option pool, or choose \"write my own\" and type your own answer text (zh / en)."
  case.tpl_wrong:
    zh: "**錯誤選項**：至少 2 個看起來合理但錯的選項；好的干擾選項要像真的會有人選。"
    en: "**Wrong options**: at least 2 plausible but wrong choices; good distractors are ones people really pick."
  case.tpl_notify:
    zh: "**要通知誰**：標準答案的通知對象；不選＝不需升級（只記錄）。"
    en: "**Notify**: the model answer for who to tell; none = no escalation (record only)."
  case.tpl_role:
    zh: "**訊息寫給**：練習者要寫訊息給哪個角色。"
    en: "**Message to**: the role the trainee writes the message to."
  case.tpl_format:
    zh: "**報告格式**：訊息要用的格式（SWR 缺陷摘要、回覆 FA、批次報告備註、交接摘要），作答框會預填各段標題。"
    en: "**Format**: the layout the message must follow (SWR defect summary, FA reply, lot-report note, handover); the answer box is pre-filled with its headings."
  case.tpl_urgency:
    zh: "**急迫度**：3＝產品正在受影響、2＝今天要處理、1＝可以排程。放進多重問題時用來判斷先後。"
    en: "**Urgency**: 3 = product at risk now, 2 = act today, 1 = can be scheduled. Used for priorities when the case is part of a multi-issue handover."
  case.tpl_keypoints:
    zh: "**訊息要點**：每行一個：「中文要點 | English point | 關鍵字1, 關鍵字2」。訊息裡出現任一個關鍵字（不分大小寫）就算有寫到；關鍵字也可以用 {名稱}。"
    en: "**Key points**: one per line: \"zh point | English point | word1, word2\". A message covers the point if it contains any of the words (not case-sensitive); words may use {names}."
  case.tpl_save:
    zh: "**儲存範本**：檢查後存到 data/cases/custom/。新範本不會覆蓋舊的；修改已存的範本會更新它。缺少的必填項會顯示原因。"
    en: "**Save template**: checks and saves it to data/cases/custom/. A new template never overwrites another; editing a saved one updates it. Anything missing is explained."
  case.tpl_practise:
    zh: "**練習這個範本**：用這個範本產生一題（中級、隨機數值）到上方作答。"
    en: "**Practise it**: generates a case from this template (intermediate, random numbers) to answer above."
  case.tpl_delete:
    zh: "**刪除範本**：先勾「確定刪除」再按刪除，範本檔案會從這台電腦移除，無法復原（已存的練習報告不受影響）。"
    en: "**Delete template**: tick \"I am sure\" first, then delete; the template file is removed from this PC and cannot be restored (saved practice reports are kept)."
  case.tpl_example:
    zh: "**載入範例範本**：用一個寫好的範例（夜班良率掉、單一 chamber 偏移）填滿整個表單，你可以直接改成自己的情境。範例用模擬資料，也可以原樣存下來練習。再按一次會用範例覆蓋目前「新範本」欄位的內容。"
    en: "**Load an example template**: fills the whole form with a worked example (a night-shift yield drop from a one-chamber shift) that you can turn into your own situation. It uses simulated data and can be saved and practised as is. Pressing it again replaces what is in the \"new template\" fields."
