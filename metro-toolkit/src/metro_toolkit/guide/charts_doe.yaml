# DOE / recipe optimizer page. Template values:
#   doe_pareto  (insights.doe_pareto):  {response} {sig_terms} {n_sig} {top_term} {r2} {r2_adj} {r2_pred} {gap} {rmse} {dof} {curv_p}
#   doe_contour (insights.doe_contour): {D} {recipe_txt} {at_edge} {pred_txt}
#   doe_confirm (insights.doe_confirm): {n_bad} {bad_resp} {worst_resp} {worst_dev} {worst_rmse}
#   always: {finding} {status}
# Status thresholds follow insights.py: pred R² < 0.5 or dof ≤ 0 → act; adj − pred > 0.2 → watch;
# unresolved curvature p < 0.05 → act; D = 0 → act; D < 0.6 or optimum on the range edge → watch;
# confirmation not acceptable → act; |confirmation − predicted| > 2 × RMSE → watch.

charts:
  doe_pareto:
    page: DOE
    title: {zh: "標準化效應 Pareto 圖＋係數表（每個回應一張）", en: "Pareto of standardised effects + coefficient table (one per response)"}
    legend:
      - item: "▬ 藍色長條 · blue bars — p < 0.05 significant 顯著"
        zh: "這一項的 |t| 超過門檻（p < 0.05）：它對 {response} 的影響大於 run-to-run 雜訊，統計上可以確定不是 0。長條越長，效應相對於估計誤差越大。顯著只代表「確定存在」，有沒有實務意義要看係數表的 coef（低→高的變化 ≈ 2 × coef）和規格／目標容許範圍相比有多大。"
        en: "This term's |t| passes the threshold (p < 0.05): its effect on {response} is larger than the run-to-run noise and statistically distinguishable from zero. A longer bar means a larger effect relative to its estimation error. Significant only means the effect is real; whether it matters in practice depends on its size: compare the coefficient in the table (low → high change ≈ 2 × coef) with the spec or target tolerance."
      - item: "▬ 灰色長條 · grey bars — p ≥ 0.05 not significant 不顯著"
        zh: "在這次實驗的雜訊與次數下，分不出這一項和 0 的差別。**不等於「沒有影響」**：可能是效應小、雜訊大或實驗次數不夠（檢定力不足）。若這個因子是某個顯著交互作用或平方項的組成（例如 A × B 是藍的、A 是灰的），A 仍要留在模型裡（hierarchy 階層原則）。"
        en: "With this experiment's noise and number of runs, the term cannot be told apart from zero. **This is not proof of no effect**: the effect may be small, the noise large, or the design too small (low power). If the factor is part of a significant interaction or square term (e.g. A × B is blue while A is grey), keep A in the model anyway (hierarchy principle)."
      - item: "┊ 深色虛線 · dark dashed line — p = 0.05 threshold 門檻 (|t| critical)"
        zh: "臨界 |t| = t 分布在殘差自由度（目前 {dof}）下的雙尾 5% 點：自由度 8 時約 2.31，自由度很大時趨近 1.96，實際數值寫在圖標題。長條越過虛線 = p < 0.05。殘差自由度 ≤ 0（模型項數和實驗次數一樣多）時沒有虛線也沒有 p 值，所有長條都是灰色：請加中心點或重複。"
        en: "Critical |t| = the two-sided 5 % point of the t distribution at the residual degrees of freedom (currently {dof}): about 2.31 at 8 dof, approaching 1.96 with many dof; the exact value is in the chart title. A bar that crosses the line = p < 0.05. With residual dof ≤ 0 (as many model terms as runs) there is no line and no p-value, and every bar is grey: add centre points or replicates."
      - item: "A, B · 主效應 main effects"
        zh: "只有因子名稱（例如 cycles、temp_c）= 線性主效應：因子從中心（編碼 0）移到高水準（+1）時，回應的平均變化。係數為正 = 設定值調高、回應變大。"
        en: "A plain factor name (e.g. cycles, temp_c) = linear main effect: the average change in the response when the factor moves from the centre (coded 0) to the high level (+1). A positive coefficient means raising the setpoint raises the response."
      - item: "A × B · 交互作用 interaction"
        zh: "A 的效果取決於 B 的設定：B 在高水準時 A 的斜率 = coef(A) + coef(A × B)，B 在低水準時 = coef(A) − coef(A × B)。顯著的交互作用代表「一次只調一個因子（OFAT）」會找錯最佳點，這也是 DOE 勝過 OFAT 的主要原因。例：CVD 的 time_s × temp_c（膜厚 = 沉積速率 × 時間，溫度決定速率，所以時間的效果跟著溫度變）。"
        en: "The effect of A depends on the setting of B: A's slope is coef(A) + coef(A × B) with B high and coef(A) − coef(A × B) with B low. A significant interaction means one-factor-at-a-time (OFAT) tuning will find the wrong optimum; it is the main reason a DOE beats OFAT. Example: CVD time_s × temp_c (thickness = deposition rate × time, and temperature sets the rate, so the effect of time changes with temperature)."
      - item: "A² · 彎曲 curvature"
        zh: "平方項：回應隨這個因子呈彎曲而不是直線。係數為正 = U 形（中間低、兩端高，範圍內可能有最低點）；為負 = 倒 U 形（範圍內可能有最高點）。每個因子至少要有 3 個水準（CCD、Box-Behnken、3 水準全因子）才估得到。例：ALD 的 temp_c²，GPC 在 ALD 溫度視窗內平坦、視窗外兩側都上升。"
        en: "Square term: the response bends with this factor instead of following a straight line. A positive coefficient = U shape (low in the middle, high at both ends; a minimum may lie inside the range); negative = inverted U (a maximum may lie inside). It needs at least 3 levels per factor (CCD, Box-Behnken, 3-level factorial). Example: ALD temp_c², because GPC is flat inside the ALD temperature window and rises on both sides of it."
    axes:
      zh: "X 軸＝|t| 標準化效應 = |係數| ÷ 標準誤（無單位），所以不同單位的因子（°C、s、cycles）可以直接比較；Y 軸＝模型項，由小到大排列，最重要的在最上面（截距 intercept 不畫）。滑鼠停在長條上可看 |t|、係數與 p 值。右側係數表：term 模型項、coef 係數（編碼單位，單位同回應）、std_err 標準誤、t、p。上方四個指標：R²、調整 R²、預測 R²、殘差 RMSE（單位同回應）。模型不含彎曲項時，會另外顯示中心點 vs 角落點的彎曲檢定（差值與 p 值）。"
      en: "X = |t|, the standardised effect = |coefficient| ÷ standard error (unitless), so factors in different units (°C, s, cycles) can be compared directly; Y = model term, sorted so the most important is at the top (the intercept is not plotted). Hover a bar for |t|, coefficient and p. Coefficient table on the right: term, coef (coded units, in the response's unit), std_err, t, p. Tiles above: R², adjusted R², predicted R², residual RMSE (in the response's unit). When the model has no curvature terms, a centre-vs-corner curvature test (difference and p-value) is shown as well."
    what:
      zh: "從所有候選模型項中，找出真正會推動 {response} 的少數幾個旋鈕：這是篩選（screening）的結論，也是之後最佳化與等高線圖的基礎。因子都換成編碼單位（低 = −1、中心 = 0、高 = +1），每個因子在同一個尺度上比較，不會因為單位或範圍大小而失真。係數表告訴你方向與大小；R²／RMSE 指標告訴你這個模型能不能拿來預測沒跑過的配方。篩選設計（2 水準全因子／部分因子）回答「哪些因子重要」；只有最佳化設計（CCD、Box-Behnken、3 水準）才回答得了「最佳點在哪裡」。"
      en: "Out of all candidate model terms, find the few knobs that really move {response}: this is the screening conclusion and the basis for the optimisation and the contour map. Factors are in coded units (low = −1, centre = 0, high = +1), so every factor is compared on the same scale regardless of its unit or range. The coefficient table gives direction and size; the R² / RMSE tiles tell you whether the model can predict a recipe that was never run. Screening designs (2-level full or fractional factorial) answer \"which factors matter\"; only optimisation designs (CCD, Box-Behnken, 3-level) can answer \"where is the optimum\"."
    read:
      zh: "好：少數幾根藍色長條遠超過虛線、其他是灰色且很短；顯著項有物理意義（例：ALD 膜厚由 cycles 主導 = GPC × 循環數，temp_c² 來自溫度視窗外 GPC 上升，purge_s 來自清洗不足的寄生 CVD）；預測 R² ≥ 0.5 且和調整 R² 相差 ≤ 0.2；RMSE 接近機台 run-to-run 加量測重複性。壞：(1) 預測 R² < 0.5 或顯示「—」→ 模型無法預測新條件；(2) 調整 R² − 預測 R² > 0.2 → 過度擬合，或某一次實驗（異常片、跑錯 recipe、量測 GOF 差）主導了模型；(3) 2 水準設計出現紅色彎曲警告 → 中間區域和角落點說的不一樣。2 水準設計的角落點所有因子都是 ±1，平方後全部 = 1，中心點全部 = 0，所以 A²、B²、C² 是同一欄：中心點只能告訴你「有彎曲」，分不出是哪個因子造成的；(4) 交互作用顯著但主效應是灰的 → 依階層原則保留主效應；(5) 藍色但 2 × coef 遠小於容許範圍 → 統計顯著、實務上不重要；(6) 每一項都是藍色、|t| 大得離譜 → 多半是沒有雜訊的計算值（例如 time_min 製程時間），p 值沒有意義，連彎曲檢定也可能顯示 p ≈ 0；(7) 部分因子設計：標成 A 的長條其實是 A 加上和它混淆的交互作用（看 run sheet 下方的混淆清單），先別急著用物理解釋；(8) 出現物理上說不通的顯著項 → 懷疑混淆、異常片、量測模型（膜層模型、GOF）問題，或實驗期間機台漂移（所以 run order 要隨機）。"
      en: "Good: a few blue bars well past the line and the rest grey and short; the significant terms make physical sense (e.g. ALD thickness dominated by cycles = GPC × number of cycles, temp_c² from GPC rising outside the temperature window, purge_s from parasitic CVD when the purge is too short); predicted R² ≥ 0.5 and within 0.2 of adjusted R²; RMSE close to the tool's run-to-run variation plus metrology repeatability. Bad: (1) predicted R² < 0.5 or shown as \"—\" → the model cannot predict new conditions; (2) adjusted − predicted R² > 0.2 → over-fit, or a single run (a bad wafer, wrong recipe loaded, poor metrology GOF) dominates the model; (3) a red curvature warning with a 2-level design → the middle of the range does not behave the way the corners suggest. In a 2-level design every factor is at ±1 at the corners, so every square is 1 there and 0 at the centre: A², B² and C² are the same column, and centre points can only tell you that there is curvature, not which factor causes it; (4) a significant interaction with a grey main effect → keep the main effect (hierarchy); (5) blue, but 2 × coef is far smaller than the tolerance → statistically significant, practically unimportant; (6) every term blue with absurd |t| → most likely a calculated response with no noise (e.g. time_min process time); the p-values mean nothing and even the curvature test can read p ≈ 0; (7) fractional design: a bar labelled A is really A plus whatever interaction is aliased with it (see the alias list under the run sheet), so hold the physics explanation until it is de-aliased; (8) a significant term that makes no physical sense → suspect aliasing, a bad run, the metrology model (layer model, GOF) or tool drift during the experiment (which is why the run order is randomised)."
    action:
      act:
        zh: "不要用這個模型決定配方。(1) 先查資料：殘差最大的幾次實驗是否跑錯 recipe、有機台警報、量測 GOF 差或量錯點位 → 重量測或重跑；(2) 若殘差自由度（目前 {dof}）≤ 0 → 加中心點或重複；(3) 若是 2 水準設計且彎曲檢定 p（目前 {curv_p}）< 0.05 → 用軸點擴充成面心 CCD：已跑的角落點與中心點可沿用，新的軸點當作第二個 block，並再加 2–3 個中心點檢查兩批之間有沒有偏移；(4) 效應小於雜訊 → 改善量測（MSA、量測點數）、增加重複，或在機台安全範圍內加大因子範圍；(5) 模型形式不對 → 改用更有物理意義的回應（例如沉積速率 = 膜厚 ÷ 時間、log NU）或縮小範圍。通知 PE：模型尚不可用，暫不做配方決定。"
        en: "Do not use this model to set a recipe. (1) Check the data first: did the runs with the largest residuals have the wrong recipe, a tool alarm, poor metrology GOF or mis-placed sites? → re-measure or re-run; (2) if the residual dof (now {dof}) is ≤ 0 → add centre points or replicates; (3) if a 2-level design shows curvature p (now {curv_p}) < 0.05 → augment with axial points to a face-centred CCD: keep the corner and centre runs already made, run the axial points as a second block and add 2–3 more centre points to check for a shift between the two blocks; (4) effects smaller than the noise → improve the metrology (MSA, more sites), add replicates, or widen the factor ranges within the tool's safe limits; (5) wrong model form → model a more physical response (e.g. deposition rate = thickness ÷ time, log NU) or narrow the range. Tell PE: the model is not usable yet, so no recipe decision for now."
      watch:
        zh: "模型可以參考，但不能完全信任。(1) 把模型降一階（二次 → 交互作用），或刪掉不顯著的高階項（保留階層），比較預測 R² 是否變好；本頁只能整階切換，逐項刪減請用統計軟體；(2) 找出殘差最大的實驗，核對晶圓、機台紀錄與量測；(3) 物理本身不是二次式時也會這樣：例如 CVD 膜厚 = 速率 × 時間，速率在反應控制區依 Arrhenius、在質傳控制區受壓力限制，二次模型只能近似 → 考慮建速率或 log 模型，或縮小範圍；(4) 之後的確認實驗要多跑幾片，並更嚴格對照預測。"
        en: "Use the model with caution. (1) Step the model down one order (quadratic → interaction) or drop non-significant higher-order terms (keeping hierarchy) and see whether predicted R² improves; this page only switches whole orders, so do term-by-term reduction in your statistics software; (2) find the run with the largest residual and check its wafer, tool log and measurement; (3) this also happens when the physics is not quadratic: CVD thickness = rate × time, with the rate following Arrhenius when reaction limited and limited by pressure when transport limited, so a quadratic is only an approximation → consider modelling the rate or a log response, or narrowing the range; (4) run more confirmation wafers later and compare them with the prediction more strictly."
      good:
        zh: "模型可用：記下顯著項與它們的物理解釋，進入最佳化。仍要做殘差檢查（本頁沒有殘差圖，真實 DOE 數據請在統計軟體看）：殘差 vs 預測值沒有喇叭形（變異不隨大小改變）、殘差 vs run order 沒有趨勢（無機台或量測漂移）、常態機率圖大致成直線、沒有單一離群點。中心點的標準差（pure error）應和 RMSE 同等級；RMSE 明顯較大 = 模型缺項（lack of fit）。"
        en: "The model is usable: record the significant terms and their physical explanation, then move on to optimisation. Still check the residuals (this page has no residual plot; for real DOE data use your statistics software): no funnel shape versus predicted value (variance does not change with level), no trend versus run order (no tool or metrology drift), a roughly straight normal probability plot, no single outlier. The centre-point standard deviation (pure error) should be similar to the RMSE; a clearly larger RMSE = missing terms (lack of fit)."
    record:
      zh: "[DOE 模型] {response} · 顯著項 {sig_terms}（{n_sig} 項，最大 {top_term}）· R² {r2}／adj {r2_adj}／pred {r2_pred}（adj − pred = {gap}）· RMSE {rmse} · 殘差自由度 {dof} · 彎曲檢定 p {curv_p} · 狀態 {status} · 處置：＿＿"
      en: "[DOE model] {response} · significant terms {sig_terms} ({n_sig}, strongest {top_term}) · R² {r2} / adj {r2_adj} / pred {r2_pred} (adj − pred = {gap}) · RMSE {rmse} · residual dof {dof} · curvature p {curv_p} · status {status} · action: ___"
    roles:
      RDA:
        zh: "【DOE 資訊】{response} 的模型：{finding}。主要由 {top_term} 推動（顯著項：{sig_terms}）。若要找缺陷或膜質異常，最有資訊的是 {top_term} 在兩端設定的實驗片，並以中心點片當參考；量測端可以從 run sheet 提供每片的設定與晶圓編號。"
        en: "[DOE info] Model for {response}: {finding}. It is driven mainly by {top_term} (significant terms: {sig_terms}). If you look for defects or film anomalies, the most informative wafers are the runs at the two extremes of {top_term}, with the centre-point wafers as reference; metrology can provide each wafer's settings and ID from the run sheet."
      PE:
        zh: "【DOE 模型】{response}：顯著項 {sig_terms}（最大 {top_term}）；R² = {r2}、adj = {r2_adj}、pred = {r2_pred}，RMSE = {rmse}（殘差自由度 {dof}）。判讀：{finding}。請確認這些效應的方向符合製程物理；若狀態不是正常，建議先補實驗（中心點或軸點）再談配方。"
        en: "[DOE model] {response}: significant terms {sig_terms} (strongest {top_term}); R² = {r2}, adj = {r2_adj}, pred = {r2_pred}, RMSE = {rmse} (residual dof {dof}). Reading: {finding}. Please check that the effect directions match the process physics; if the status is not normal, I suggest adding runs (centre or axial points) before we discuss a recipe."
      EE:
        zh: "【DOE／機台】{response} 主要受 {top_term} 影響（顯著項：{sig_terms}）。請確認機台能穩定控制這個參數（設定解析度、實際值 vs 設定值、各 chamber 是否一致），因為模型殘差 RMSE {rmse} 已包含機台 run-to-run 變異。實驗期間若有警報、換零件或換 chamber，請告知，那幾片要排除或重跑。"
        en: "[DOE / tool] {response} is driven mainly by {top_term} (significant terms: {sig_terms}). Please confirm the tool holds this parameter tightly (setpoint resolution, actual vs setpoint, chamber-to-chamber agreement), because the model's residual RMSE {rmse} already includes the tool's run-to-run variation. If there were alarms, part swaps or a chamber change during the runs, let us know so those wafers can be excluded or re-run."
      PIE_YE:
        zh: "【DOE 進度】{response} 模型狀態：{status}。{finding}。目前只是找出影響因子（{sig_terms}），還沒有任何配方變更；若 {top_term} 也可能影響其他和電性有關的膜特性（例如 high-k 的 EOT／漏電、TiN 的 Rs），請告訴我們要一併量測哪些項目。"
        en: "[DOE progress] Model status for {response}: {status}. {finding}. So far we have only identified the driving factors ({sig_terms}); there is no recipe change yet. If {top_term} could also affect other film properties that matter electrically (e.g. EOT / leakage for high-k, Rs for TiN), tell us what to add to the measurements."
      MGR_QE:
        zh: "【狀態】DOE {response} 模型：{status}。{finding}。預測 R² = {r2_pred}。已完成：實驗、量測、建模；待決定：進入最佳化，或先追加實驗（成本：晶圓與機台時間）。紀錄：DOE 報告與 e-log 已更新。"
        en: "[Status] DOE model for {response}: {status}. {finding}. Predicted R² = {r2_pred}. Done: runs, measurements, model. Decision needed: move on to optimisation, or add runs first (cost: wafers and tool time). Records: DOE report and e-log updated."

  doe_contour:
    page: DOE
    title: {zh: "配方地圖：整體滿意度 D／預測回應等高線", en: "Recipe map: contour of overall desirability D or a predicted response"}
    legend:
      - item: "▒ 藍色漸層等高線＋色條 · blue filled contour + colour bar"
        zh: "模型預測值的等高線圖：顏色越深 = D 越高（或所選回應越大），線上的數字是等值線的值，右側色條是對照。顯示「整體滿意度 D」時，深色區 = 所有目標同時被滿足得最好的區域；D = 0（最淺）= 至少一個回應不可接受。顯示單一回應時要注意方向：「越小越好」的回應（例如 nu_pct），深色反而是差的區域。"
        en: "Contours of the model prediction: darker = higher D (or a higher value of the chosen response); numbers on the lines are the contour values and the colour bar on the right is the key. When showing overall desirability D, the dark region is where all goals are met best together; D = 0 (lightest) = at least one response unacceptable. When showing a single response, mind the direction: for a minimise response (e.g. nu_pct) dark means worse."
      - item: "○ 白點深框 · white dots with dark ring — design runs 實驗點"
        zh: "DOE 實際跑過的設定，投影到這兩個因子上（這些點的其他因子不一定等於圖上固定的值）。建議配方被實驗點包圍 = 內插，可信度較高；離實驗點越遠，預測越不準。"
        en: "Settings actually run in the DOE, projected onto these two factors (their other factors are not necessarily at the values held fixed in this slice). A recipe surrounded by design runs = interpolation, more trustworthy; the farther from any run, the less precise the prediction."
      - item: "★ 橘色星號 · orange star — suggested recipe 建議配方"
        zh: "最佳化找到的建議配方（預測 D = {D}）：{recipe_txt}。只在實驗範圍內搜尋（不外插）。它是模型預測的最佳點，不是量測結果，要靠確認實驗證明。"
        en: "The suggested recipe from the optimiser (predicted D = {D}): {recipe_txt}. The search stays inside the tested range (no extrapolation). It is the model's predicted best point, not a measurement; the confirmation runs must prove it."
    axes:
      zh: "X 軸、Y 軸＝所選的兩個因子，用實際單位；畫出的範圍就是實驗範圍（低到高），沒有任何外插。顏色＝整體滿意度 D（0–1，無單位）或所選回應的預測值（單位同回應）。其他因子固定在建議配方的值（寫在圖標題）：這是穿過最佳點的一個 2-D 切面，不是整個配方空間。滑鼠停留可讀任一點的預測值。"
      en: "X and Y = the two chosen factors in real units; the plotted range is exactly the tested range (low to high), with no extrapolation. Colour = overall desirability D (0–1, unitless) or the predicted value of the chosen response (in its unit). All other factors are held at the suggested recipe (listed in the title): this is a 2-D slice through the optimum, not the whole recipe space. Hover for the prediction at any point."
    what:
      zh: "多個回應要同時顧（膜厚打到目標、均勻度越好越好、產能不能太差）。每個回應先換成滿意度 d（0 = 不可接受、1 = 完美），再用加權幾何平均合成整體滿意度 D（Derringer–Suich 方法）。幾何平均的特性：任何一個 d = 0，D 就是 0，某一項再好也彌補不了另一項不及格。這張圖顯示甜蜜點在哪裡、製程窗口有多寬、對設定值有多敏感。圖上的值全部是模型預測，模型不好（見 Pareto 的狀態），這張圖也不可信。"
      en: "Several responses must be satisfied at once (hit the thickness target, the best possible uniformity, acceptable throughput). Each response becomes a desirability d (0 = unacceptable, 1 = perfect), and the weighted geometric mean of all d gives the overall desirability D (Derringer–Suich). With a geometric mean, any d = 0 makes D = 0: excellence in one response cannot buy back a failure in another. The map shows where the sweet spot is, how wide the process window is and how sensitive it is to the setpoints. Every value on it is a model prediction: if the model is poor (see the Pareto status), this map is not trustworthy either."
    read:
      zh: "好：星號位在一大片深色平台中央、離邊界有距離、四周有實驗點；星號附近的等高線間距寬 → 對設定值變動不敏感（溫度分布、MFC 流量、時間誤差都不容易讓晶圓掉出窗口），這種穩健（robust）的點比一個尖峰更適合量產。壞：(1) 星號貼在圖的邊界上 → 最佳點在實驗範圍邊緣，真正的最佳點可能在範圍外；模型不能外插，要做下一輪往那個方向延伸的 DOE（例：CVD TiN 要在低 NU 的溫度下長到 10 nm，time_s 常被推到上限 120 s）；(2) 深色區很窄或像一條山脊 → 製程窗口小，需要嚴格控制，或找一個能打破取捨的新因子；(3) 整張圖都是 D = 0 → 這個範圍內沒有配方能同時滿足所有目標；(4) 星號附近沒有實驗點 → 預測不確定性大。看物理是否合理：ALD 的甜蜜點應在溫度視窗中間（GPC 平坦，膜厚對溫度不敏感），purge 要長到能壓下寄生 CVD，又不能長到拖垮產能；CVD 則在反應控制（低溫：速率依 Arrhenius、對溫度很敏感，加熱器溫度分布反映在 NU）與質傳控制（高溫：氣體沿晶圓耗盡、NU 變差，速率受壓力限制）之間取捨。二次模型會把這種區域轉換「抹平」，轉折附近的預測要特別小心。"
      en: "Good: the star sits in the middle of a broad dark plateau, away from the edges and surrounded by design runs; contour lines are widely spaced around it → insensitive to setpoint variation (temperature profile, MFC flow and timing errors are unlikely to push wafers out of the window). Such a robust point suits production better than a sharp peak. Bad: (1) the star touches the plot boundary → the optimum is on the edge of the tested range and the true optimum may lie outside; the model cannot extrapolate, so run the next DOE extended in that direction (example: to grow 10 nm of CVD TiN at a low-NU temperature, time_s is often pushed to its 120 s limit); (2) a narrow dark region or a ridge → a small process window that needs tight control, or a new factor that breaks the trade-off; (3) D = 0 across the whole map → no recipe in this range meets all goals; (4) no design runs near the star → large prediction uncertainty. Check the physics: the ALD sweet spot should be in the middle of the temperature window (GPC flat, thickness insensitive to temperature), with a purge long enough to suppress parasitic CVD yet short enough not to kill throughput; CVD trades off between reaction-limited growth (low temperature: the rate follows Arrhenius and is very temperature sensitive, so the heater profile shows up in NU) and transport-limited growth (high temperature: gas depletion across the wafer worsens NU and pressure limits the rate). A quadratic model smooths over such a regime change, so be extra careful near the transition."
    action:
      act:
        zh: "目前沒有可用的配方，不要硬挑一個點。(1) 先檢查目標設定：目標值、容許、最佳／不可接受值是否合理、單位是否正確（上傳資料時預設全部是「越小越好」，要改成真正的目標）；(2) 把「顯示」切換到各個回應，找出是哪一個回應在整個範圍內都不及格；(3) 與 PE／PIE 討論：放寬某個目標（整合端是否還有餘裕），或加大範圍、加入新的因子（新的硬體旋鈕）做下一輪 DOE；(4) 先確認 Pareto 的模型狀態，模型不可用時 D 也不可信。"
        en: "There is no usable recipe yet; do not force a point. (1) Check the goal settings: are target, tolerance, best and unacceptable values realistic and in the right unit? (Uploaded data defaults every response to 'minimise': change it to the real goal.) (2) Switch the display to each response to find the one that fails everywhere in the range; (3) discuss with PE / PIE: relax a goal (is there integration margin?), or widen the range or add a factor (a new hardware knob) in the next DOE; (4) check the model status on the Pareto first: if the model is not usable, D is not trustworthy either."
      watch:
        zh: "可以做確認實驗，但現在就要規劃下一步。落在範圍邊界的因子（{at_edge}）：下一輪 DOE 把中心移到目前最佳點附近，範圍往邊界外延伸（在機台安全範圍、interlock 與整合限制之內）；模型本身不能拿來預測範圍外。D < 0.6：目標之間有明顯取捨，把各回應的等高線拿給 PE／PIE 看，量化取捨（例如 NU 每改善 0.1% 要多花多少製程時間），由他們決定權重；或尋找能同時改善兩者的新因子。"
        en: "Confirmation runs are fine, but plan the next step now. Factors on the range edge ({at_edge}): centre the next DOE near the current optimum and extend the range past that edge (within the tool's safe operating range, interlocks and integration constraints); the model itself cannot predict outside the range. D < 0.6: the goals clearly trade off; show PE / PIE the contour of each response to quantify the trade (e.g. how much process time each 0.1 % of NU costs) and let them set the weights, or look for a new factor that improves both."
      good:
        zh: "在建議配方 {recipe_txt} 跑確認實驗（至少 3 片）。先把設定值四捨五入到機台可設定的解析度（ALD cycles 必須是整數、溫度到 1 °C 等），在等高線上停留確認修整後的預測仍然好；若兩個候選點 D 差不多，選等高線較平坦、離邊界較遠的那一個（較穩健）。預測回應：{pred_txt}。"
        en: "Run confirmation wafers (at least 3) at the suggested recipe {recipe_txt}. First round the setpoints to the tool's resolution (ALD cycles must be an integer, temperature to 1 °C, etc.) and hover the contour to check the prediction is still good after rounding; if two candidate points have similar D, choose the one in the flatter region farther from the edges (more robust). Predicted responses: {pred_txt}."
    record:
      zh: "[DOE 最佳化] 建議配方 {recipe_txt} · 預測 {pred_txt} · D = {D} · 邊界因子 {at_edge} · 狀態 {status} · 下一步：確認實驗 ＿ 片／下一輪 DOE 範圍 ＿＿"
      en: "[DOE optimisation] suggested recipe {recipe_txt} · predicted {pred_txt} · D = {D} · factors on the range edge {at_edge} · status {status} · next: ___ confirmation wafers / next DOE range ___"
    roles:
      RDA:
        zh: "【DOE 建議配方】建議配方 {recipe_txt}（預測 D = {D}）。確認實驗片會是第一批在這個條件下長的晶圓，請安排缺陷檢測／review，和同批的 POR 對照片比較；若要看膜質（粗糙度、介面、結晶），也請用這幾片。落在範圍邊界的因子：{at_edge}。"
        en: "[DOE suggested recipe] Suggested recipe {recipe_txt} (predicted D = {D}). The confirmation wafers will be the first grown at this condition: please plan defect inspection / review on them and compare with the POR control wafer in the same lot; if film quality (roughness, interface, crystallinity) is of interest, use these wafers as well. Factors on the range edge: {at_edge}."
      PE:
        zh: "【DOE 配方建議】最佳化判讀：{finding}。請確認目標與權重符合你的優先順序；同意後我們在 {recipe_txt} 安排至少 3 片確認實驗（含 POR 對照片）。落在範圍邊界的因子：{at_edge}；如果有，建議下一輪 DOE 往該方向延伸。"
        en: "[DOE recipe proposal] Optimisation reading: {finding}. Please confirm the goals and weights match your priorities; once agreed we will run at least 3 confirmation wafers (with a POR control wafer) at {recipe_txt}. Factors on the range edge: {at_edge}; if any, I suggest extending the next DOE in that direction."
      EE:
        zh: "【機台設定確認】下一步要在 {recipe_txt} 跑確認實驗。請確認：(1) 這些設定值在機台允許且已驗證的範圍內，設定解析度足夠；(2) 落在範圍邊界的因子 {at_edge}，下一輪能否再往外延伸（加熱器上限、MFC 量程、壓力控制、interlock）；(3) 安排固定的 chamber，並確認近期沒有 PM 或零件更換。"
        en: "[Tool settings check] Next we run confirmation wafers at {recipe_txt}. Please confirm: (1) these setpoints are within the tool's allowed and qualified range, with enough setpoint resolution; (2) whether the factors on the range edge ({at_edge}) can be extended further in the next round (heater limit, MFC range, pressure control, interlocks); (3) a fixed chamber is reserved, with no recent PM or part swap."
      PIE_YE:
        zh: "【配方方向】模型建議 {recipe_txt}，預測 {pred_txt}（D = {D}）。D 低於 0.6 代表目標互相取捨，需要你們決定優先順序（例如膜厚置中 vs 均勻度 vs 產能）。這個配方要確認實驗通過才會進 qual，期間請提出電性與良率需要驗證的項目。"
        en: "[Recipe direction] The model suggests {recipe_txt}, predicting {pred_txt} (D = {D}). A D below 0.6 means the goals trade off and we need your priorities (e.g. thickness centring vs uniformity vs throughput). The recipe goes to qual only after the confirmation runs pass; please list the electrical and yield checks you need in the meantime."
      MGR_QE:
        zh: "【狀態】DOE 最佳化：{status}，預測 D = {D}。{finding}。下一步：確認實驗（至少 3 片）。POR 尚未變更；配方發行須經確認實驗、qual 與 change control。"
        en: "[Status] DOE optimisation: {status}, predicted D = {D}. {finding}. Next: confirmation runs (at least 3 wafers). The POR is unchanged; recipe release requires confirmation runs, the qual and change control."

  doe_confirm:
    page: DOE
    title: {zh: "確認實驗表與答案卷（預測 vs 實測）", en: "Confirmation-run table and answer key (predicted vs measured)"}
    legend:
      - item: "回應 · response"
        zh: "每列一個回應（例如 thickness、nu_pct、time_min），單位同 DOE 的回應。"
        en: "One row per response (e.g. thickness, nu_pct, time_min), in the same unit as in the DOE."
      - item: "預測 · predicted"
        zh: "模型在建議配方的預測值（就是最佳化區顯示的預測回應）。它預測的是平均值；單片晶圓還會有約 ± RMSE 的 run-to-run 雜訊。"
        en: "The model's prediction at the suggested recipe (the predicted responses shown under Optimise). It predicts the mean; a single wafer still scatters by about ± RMSE from run to run."
      - item: "確認平均 · confirmation mean"
        zh: "確認片量測值的平均。和預測比：|確認平均 − 預測| ≤ 2 × 模型 RMSE 視為吻合。這是經驗法則，約等於單片晶圓的 95% 預測區間；精確的區間 = 預測 ± t × RMSE × √(1/n + h)，n = 確認片數，h = 配方點的 leverage（越靠近範圍邊緣越大）。目前偏差最大的是 {worst_resp}：{worst_dev} 倍 RMSE（RMSE = {worst_rmse}）。"
        en: "Average of the confirmation wafers' measurements. Compare with the prediction: |confirmation mean − predicted| ≤ 2 × model RMSE counts as agreement. This is a rule of thumb, roughly the 95 % prediction interval for one wafer; the exact interval = predicted ± t × RMSE × √(1/n + h), with n = number of confirmation wafers and h = the leverage of the recipe point (larger near the edges of the range). Largest deviation now: {worst_resp}, {worst_dev} × RMSE (RMSE = {worst_rmse})."
      - item: "確認標準差 · confirmation sd"
        zh: "確認片之間的標準差（晶圓間變異）。應和模型 RMSE、中心點標準差同等級；明顯較大 → 這個配方點比 DOE 平均更不穩（例如落在斜率很陡的區域，設定值小變動就被放大），或確認期間機台不穩。片數少時很不準：3 片（自由度 2）時 σ 的 95% 信賴區間約為估計值的 0.5–6 倍；只有 1 片時無法計算。"
        en: "Standard deviation between the confirmation wafers (wafer-to-wafer variation). It should be similar to the model RMSE and the centre-point sd; clearly larger → this recipe point is less stable than the DOE average (e.g. it sits on a steep slope that amplifies small setpoint variation) or the tool was unstable during the runs. With few wafers it is very uncertain: with 3 wafers (2 dof) the 95 % confidence interval for σ spans about 0.5× to 6× the estimate; with 1 wafer it cannot be computed."
      - item: "可接受 · acceptable ✓/✗"
        zh: "✓ = 確認平均的滿意度 d > 0：在目標值 ± 容許之內（目標型），或優於「不可接受」值（越小／越大越好型）。✗ = 不可接受，這個配方不能發行。注意：判斷的是平均值不是每一片，也只檢查你設定的目標，不等於所有規格都通過。目前不可接受：{bad_resp}（{n_bad} 項）。"
        en: "✓ = the confirmation mean has desirability d > 0: within target ± tolerance (target goals) or better than the unacceptable value (minimise / maximise goals). ✗ = not acceptable: this recipe cannot be released. Note that it judges the mean, not every wafer, and checks only the goals you set, which is not the same as passing every spec. Not acceptable now: {bad_resp} ({n_bad})."
      - item: "答案卷 · answer key — your recipe's true desirability vs the true optimum"
        zh: "只有虛擬機台才有：用沒有雜訊的真實曲面、以及你目前設定的目標與權重，計算 (1) 同樣因子（其他因子固定在中間值）下的真實最佳配方與它的 D，(2) 你的建議配方的真實回應與真實 D，並顯示你的配方 = 真實最佳的幾 %。差距來自：模型形式（二次式描述不了 ALD purge 太短時指數型增加的寄生 CVD，或 CVD 的反應／質傳轉換）、實驗雜訊、設計太粗、最佳點在範圍邊界。模型預測的 D 通常比真實 D 樂觀（最佳化會挑到模型誤差剛好有利的點）。真實 D = 0 表示至少一個回應其實不可接受。真實 fab 沒有答案卷：確認實驗與 qual 是唯一的證據。"
        en: "Virtual tool only: using the noise-free true surface and the goals and weights you set, the page computes (1) the true optimum over the same factors (others fixed at their centre) and its D, and (2) the true responses and true D of your suggested recipe, and shows your recipe as a percentage of the true optimum. Gaps come from the model form (a quadratic cannot describe the parasitic CVD that grows exponentially when the ALD purge is too short, or the CVD reaction/transport transition), noise in the runs, a coarse design and optima on the range edge. The model's predicted D is usually optimistic compared with the true D (the optimiser picks the point where model error happens to look favourable). A true D of 0 means at least one response is in fact unacceptable. A real fab has no answer key: confirmation runs and the qual are the only proof."
    axes:
      zh: "這是表格不是圖，沒有座標軸：每列一個回應，數值單位同回應；可接受欄用 ✓／✗ 符號，不靠顏色。下方「看答案」展開後：左表為每個因子的真實最佳設定 vs 你的建議，右表為兩者的真實回應，最後是真實滿意度指標（標籤寫出真實最佳 D，下方註明你的配方 = 真實最佳的幾 %）。"
      en: "This is a table, not a chart, so there are no axes: one row per response, values in the response's unit; the acceptable column uses ✓ / ✗ symbols rather than colour. In the answer-key expander below: the left table compares the true optimum setting with your suggestion for each factor, the right table their true responses, followed by the true-desirability tile (its label states the true optimum D, and the caption gives your recipe as a percentage of it)."
    what:
      zh: "DOE 模型是用已經跑過的實驗點建立的，但建議配方本身通常從來沒跑過。確認實驗就是用新的晶圓驗證預測：(1) 結果是否滿足目標；(2) 是否和模型預測一致。兩者都通過，才有資格進 qual（多批、多天、多 chamber 驗證）與 change control，最後更新 POR、發行配方。只要有一項不可接受，就不能發行。"
      en: "The DOE model was built from runs already made, but the suggested recipe itself has usually never been run. Confirmation runs test the prediction on new wafers: (1) do the results meet the goals, and (2) do they agree with the model? Only when both pass does the recipe qualify for the qual (several lots, days and chambers) and change control, leading to the POR update and recipe release. Any unacceptable response blocks release."
    read:
      zh: "好：每列都是 ✓；|確認平均 − 預測| ≤ 2 × RMSE；確認標準差和 RMSE 同等級；答案卷中你的配方接近真實最佳。壞：(1) 有 ✗ → 配方不及格；(2) 可接受但偏差 > 2 × RMSE → 模型在這一區有偏差：可能是模型形式不對（例：ALD purge 很短時寄生 CVD 呈指數增加，二次式會低估；CVD 在反應／質傳轉換附近），也可能是確認實驗那天機台、進料或量測整體偏移（所以同批要放一片 POR 對照片來區分）；(3) 確認標準差遠大於 RMSE → 配方點不穩健；(4) 模型 RMSE 本身很大（Pareto 狀態不佳）→ ±2 RMSE 變成很鬆的檢查，不及格的結果也可能「吻合」預測，這時吻合沒有意義。陷阱：沒有雜訊的計算型回應（例如 time_min 製程時間）RMSE 幾乎為 0，偏差除以 RMSE 會變成幾千倍以上，這時要看絕對差值；如果絕對差值真的不小，代表模型形式錯了。例：預設因子順序下的 2^(3−1) 部分因子設計（C = AB）中，決定製程時間的 cycles × purge_s 交互作用和 temp_c 主效應混淆，模型會誤以為溫度影響製程時間。"
      en: "Good: every row ✓; |confirmation mean − predicted| ≤ 2 × RMSE; confirmation sd similar to the RMSE; in the answer key your recipe is close to the true optimum. Bad: (1) any ✗ → the recipe fails a goal; (2) acceptable but off by more than 2 × RMSE → the model is biased in this region: either the model form is wrong (e.g. parasitic CVD rising exponentially at very short ALD purge, which a quadratic underestimates; or the CVD reaction/transport transition), or the tool, incoming material or metrology shifted on the day of the confirmation (which is why a POR control wafer goes into the same lot); (3) confirmation sd far above the RMSE → the recipe point is not robust; (4) a large model RMSE (poor Pareto status) → ±2 RMSE becomes a loose check, and even a failing result can 'agree' with the prediction, so agreement means little. Trap: a calculated response without noise (e.g. time_min process time) has an RMSE of almost 0, so the deviation in RMSE units can reach thousands; judge the absolute difference instead. If the absolute difference is genuinely large, the model form is wrong. Example: in the 2^(3−1) fractional design with the default factor order (C = AB), the cycles × purge_s interaction that sets the process time is aliased with the temp_c main effect, so the model wrongly concludes that temperature changes the process time."
    action:
      act:
        zh: "不要發行這個配方，POR 維持不變。(1) 先確認量測：重量測、查 GOF 與量測機台監控片；(2) 確認實際跑的配方：設定值有沒有被四捨五入錯或輸入錯、機台 log 的實際溫度／壓力／時間、chamber 是否正確、有無警報；(3) 確定真的不及格 → 模型在這一區不可信：在目前配方附近做一個範圍較小的新 DOE（例如面心 CCD），並把這次確認數據一起放進去；或與 PE／PIE 重新檢討目標。不及格項目：{bad_resp}。"
        en: "Do not release this recipe; the POR stays as it is. (1) Verify the measurement first: re-measure, check GOF and the metrology monitor wafer; (2) verify the recipe actually run: were setpoints rounded wrongly or mistyped, what do the tool logs show for actual temperature / pressure / time, was it the right chamber, any alarms; (3) if the failure is real, the model cannot be trusted in this region: run a new, smaller DOE (e.g. a face-centred CCD) centred near this recipe and include these confirmation data, or revisit the goals with PE / PIE. Failing responses: {bad_resp}."
      watch:
        zh: "結果可接受，但模型在這一區有偏差（{worst_resp}：{worst_dev} 倍 RMSE）。(1) 先用 POR 對照片判斷是不是當天整體偏移；(2) 把確認數據加進 DOE 資料重新擬合，它們是最有價值的新資訊；(3) 加跑確認片（不同天、不同 chamber），看偏差是否穩定；穩定的偏差可以用調整 target 修正（例如調整 cycles 或沉積時間）後再確認一次；(4) 不要只憑一批就發行。若 RMSE 幾乎為 0（計算型回應），改用絕對差值判斷。"
        en: "The results are acceptable, but the model is biased here ({worst_resp}: {worst_dev} × RMSE). (1) Use the POR control wafer to see whether the whole day shifted; (2) add the confirmation data to the DOE data and refit: they are the most valuable new information; (3) run more confirmation wafers (another day, another chamber) to see whether the offset is stable; a stable offset can be corrected by re-targeting (e.g. adjusting cycles or deposition time) and confirming again; (4) do not release on one lot. If the RMSE is essentially 0 (a calculated response), judge by the absolute difference instead."
      good:
        zh: "確認通過，可以進 qual／發行流程：(1) qual 計畫：多批、多天、所有要使用的 chamber；量完整的膜特性（膜厚 map、NU，以及 DOE 沒有包含的 n/k、密度、粗糙度、組成、應力、缺陷）與電性（例如 high-k 的 EOT／漏電、TiN 的 Rs）；(2) 用新配方的數據建立新的 SPC Phase I 與管制界限，更新 OCAP；(3) change control：變更申請、風險評估、PIE／YE／QE 簽核、配方版本管理，最後更新 POR、發行配方；(4) 量產初期加嚴抽樣。"
        en: "Confirmed: proceed to qual / release. (1) Qual plan: several lots, days and every chamber that will run the recipe; measure the full film properties (thickness map, NU, and what the DOE did not cover: n/k, density, roughness, composition, stress, defects) and electrical results (e.g. EOT / leakage for high-k, Rs for TiN); (2) build a new SPC Phase I and control limits from the new recipe's data and update the OCAP; (3) change control: change request, risk assessment, PIE / YE / QE sign-off and recipe version control, then the POR update and recipe release; (4) tighten sampling on the first production lots."
    record:
      zh: "[DOE 確認] 建議配方確認實驗 · 不可接受 {n_bad} 項（{bad_resp}）· 偏差最大 {worst_resp} = {worst_dev} × RMSE（RMSE {worst_rmse}）· 狀態 {status} · 決定：qual／修正 target／重做 DOE ＿＿"
      en: "[DOE confirmation] confirmation runs at the suggested recipe · not acceptable: {n_bad} ({bad_resp}) · largest deviation {worst_resp} = {worst_dev} × RMSE (RMSE {worst_rmse}) · status {status} · decision: qual / re-target / new DOE ___"
    roles:
      RDA:
        zh: "【確認實驗】新配方確認片的結果：{finding}。這幾片是新條件下的第一批晶圓，請在進 qual 前做缺陷檢測／review，和同批 POR 對照片比較；若 {bad_resp} 不及格，請協助做切面或膜質分析，找出物理原因。"
        en: "[Confirmation runs] Results on the new recipe's confirmation wafers: {finding}. These are the first wafers at the new condition: please run defect inspection / review before the qual and compare with the POR control wafer in the same lot; if {bad_resp} failed, please help with cross-section or film-quality analysis to find the physical cause."
      PE:
        zh: "【DOE 確認結果】{finding}。偏差最大：{worst_resp}，確認平均與預測差 {worst_dev} 倍模型 RMSE（RMSE = {worst_rmse}）；不可接受：{bad_resp}。建議：狀態正常 → 開 qual；有偏差 → 加入確認數據重新擬合並追加確認片；不及格 → 在此配方附近做小範圍 DOE。"
        en: "[DOE confirmation result] {finding}. Largest deviation: {worst_resp}, confirmation mean vs prediction = {worst_dev} × model RMSE (RMSE = {worst_rmse}); not acceptable: {bad_resp}. Proposal: normal → open the qual; biased → refit with the confirmation data and add confirmation wafers; failed → a small DOE around this recipe."
      EE:
        zh: "【確認實驗／機台】確認結果：{status}。請提供確認片執行時的機台 log（實際溫度、壓力、時間、流量）、使用的 chamber 與警報紀錄，以排除機台因素；若要進 qual，請安排所有會使用的 chamber，並確認近期 PM 狀態。"
        en: "[Confirmation / tool] Confirmation result: {status}. Please provide the tool logs for the confirmation runs (actual temperature, pressure, time, flows), the chamber used and any alarms, so tool causes can be ruled out; if we go to qual, please schedule every chamber that will run the recipe and confirm the recent PM status."
      PIE_YE:
        zh: "【新配方確認】{finding}。不可接受項：{bad_resp}。確認通過後的 qual 需要你們定義電性與良率的驗收條件（例如 EOT／漏電、Rs、相關 test key）以及要跑的批數與產品；qual 與 change control 完成前，產品仍走 POR。"
        en: "[New recipe confirmation] {finding}. Not acceptable: {bad_resp}. If it confirms, the qual needs your electrical and yield acceptance criteria (e.g. EOT / leakage, Rs, relevant test keys) and the lots and products to run; product stays on the POR until the qual and change control are complete."
      MGR_QE:
        zh: "【狀態】DOE 確認實驗：{status}。{finding}。不可接受 {n_bad} 項。已完成：DOE、建模、最佳化、確認實驗；待決定：是否開 qual（或重做 DOE）。配方發行須經 qual 與 change control 簽核；POR 目前不變，DOE 報告與 e-log 已更新。"
        en: "[Status] DOE confirmation runs: {status}. {finding}. Not acceptable: {n_bad}. Done: DOE, model, optimisation, confirmation runs. Decision needed: open the qual (or redo the DOE). Recipe release requires the qual and change-control sign-off; the POR is unchanged for now, and the DOE report and e-log are updated."
