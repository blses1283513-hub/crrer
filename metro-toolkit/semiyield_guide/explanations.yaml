# Hover explanations for SemiYield's dashboard (Traditional Chinese + English term).
# Edit freely, then restart the dashboard. Nothing in SemiYield itself is modified.
#
# widgets:  shown as the "?" tooltip next to an input or metric card.
#   label     exact label used by SemiYield (a leading match is enough, e.g. "Temperature")
#   min/max   (sliders) disambiguate the same label used on different tabs
#   options   (selectbox) exact option list, to disambiguate the same label
#   help      text; Streamlit renders basic Markdown
# charts:   matched by the figure title (regex). Hover text is attached to the data points.
#   hover     Plotly hovertemplate: %{x}, %{y:.2f} insert the point's values, <br> = new line
#   lines     explanation for reference lines (hline/vline); matched by their annotation text
#
# Covers all six pages: Simulation, Data Generator, SPC Dashboard, Yield Prediction,
# Process Optimizer, SPICE Export. Charts without an entry get a generic "x / y" hover.
#   kind      (optional) only match this widget type, e.g. metric / number_input / subheader
#   features  process-parameter names (bottom of file) -> used wherever SemiYield shows a column name

widgets:
  - label: "Navigation"
    help: |
      選擇頁面：**Simulation** 單一製程步驟的物理模型、**Data Generator** 產生合成晶圓廠資料、
      **SPC Dashboard** 管制圖與製程能力、**Yield Prediction** 良率機器學習、
      **Process Optimizer** 貝氏最佳化找製程窗口、**SPICE Export** 輸出電路模型。
  - label: "Upload process data CSV"
    help: "上傳自己的製程資料 CSV（至少一個數值欄位、10 筆以上資料）。**請勿上傳公司機密資料到公開環境。**"
  # ------------------------------------------------------------------ Oxidation (Deal-Grove)
  - label: "Temperature (C)"
    min: 800
    max: 1200
    help: |
      **Temperature 溫度（氧化）**：氧化爐管的溫度。
      溫度越高，氧化速率常數越大（Arrhenius 關係），相同時間長出的 SiO₂ 越厚。
      製程位置：閘極氧化層、墊氧化層、場氧化層的成長步驟。
  - label: "Atmosphere"
    options: ["dry", "wet"]
    help: |
      **Atmosphere 氧化氣氛**
      - **dry 乾氧（O₂）**：成長慢、膜緻密、品質高，用於**閘極氧化層**。
      - **wet 濕氧（H₂O 蒸氣）**：成長快、膜較疏鬆，用於**厚的隔離／場氧化層**。
  - label: "Max time (min)"
    help: |
      **Max time 最長氧化時間**：模擬的氧化時間長度。
      同時決定圖的 X 軸範圍，以及下方「Final Thickness」所使用的時間。
  - label: "Initial oxide thickness (nm)"
    help: |
      **Initial oxide thickness 初始氧化層厚度**：氧化開始前已存在的氧化層，
      例如自然氧化層（約 1–2 nm）或前一步驟留下的氧化層。
      在 Deal-Grove 公式 x² + Ax = B(t + τ) 中對應時間偏移 τ。

  # ------------------------------------------------------------------ Implantation
  - label: "Ion species"
    help: |
      **Ion species 離子種類**
      - **boron 硼 B**：p 型，質量輕、射程深，常用於 p 井與通道摻雜。
      - **phosphorus 磷 P**：n 型，中等質量。
      - **arsenic 砷 As**：n 型，較重、射程淺，常用於源／汲極。
      - **antimony 銻 Sb**：n 型，最重、射程最淺，用於超淺接面或埋層。
  - label: "Energy (keV)"
    help: |
      **Energy 植入能量**：離子被加速的能量。
      能量越高，離子打得越深，濃度峰值（投影射程 Rp）越深、分布越寬（ΔRp 越大）。
  - label: "Dose (cm^-2)"
    help: |
      **Dose 劑量 Φ**：單位面積植入的離子總數。
      劑量決定濃度高低：峰值濃度 ≈ Φ / (√(2π)·ΔRp)。劑量加倍，整條曲線約抬高一倍。
  - label: "Background doping (cm^-3)"
    help: |
      **Background doping 基板背景摻雜濃度**：晶圓原本的摻雜濃度。
      植入濃度曲線下降到與它相等的深度，就是接面深度 xj（pn 接面位置）。
  - label: "Distribution model"
    help: |
      **Distribution model 分布模型**
      - **gaussian 高斯**：對稱的鐘形，簡單，適合粗估。
      - **pearsoniv Pearson IV**：加入偏斜（skewness）與峰度（kurtosis），
        能描述輕離子（如硼）往深處拖尾的真實形狀。

  # ------------------------------------------------------------------ Etching (Langmuir-Hinshelwood)
  - label: "Etch mode"
    help: |
      **Etch mode 蝕刻模式**
      - **single 單一反應物**：速率只取決於一種蝕刻氣體的壓力。
      - **two_reactant 雙反應物**：兩種氣體（第二種為 O₂）都吸附在表面並彼此反應
        （Langmuir-Hinshelwood 機制），速率同時受兩者壓力影響。
  - label: "Material"
    options: ["SiO2", "Si", "Si3N4"]
    help: |
      **Material 被蝕刻的材料**：SiO₂（氧化矽）、Si（矽）、Si₃N₄（氮化矽）。
      不同材料的反應常數不同，造成速率差異，也就是**選擇比**的來源。
  - label: "Pressure (mTorr)"
    help: |
      **Pressure 蝕刻氣體壓力**：壓力越高，表面吸附的反應物越多，速率越快，
      但會趨近飽和（R = k_s·KP / (1+KP)，表面被佔滿後不再增加）。
  - label: "Temperature (C)"
    min: 20
    max: 400
    help: |
      **Temperature 蝕刻溫度**：晶圓／腔體溫度。
      溫度越高，表面反應越容易越過活化能障礙，蝕刻速率越快（Arrhenius 關係）。
  - label: "O2 pressure (mTorr)"
    help: |
      **O2 pressure 氧氣壓力**（僅雙反應物模式）：第二種反應物 O₂ 的壓力。
      與蝕刻氣體在表面競爭／協同，改變整體蝕刻速率。

  # ------------------------------------------------------------------ Deposition (CVD / PVD / ALD)
  - label: "Process type"
    help: |
      **Process type 沉積製程**
      - **LPCVD 低壓化學氣相沉積**：高溫、膜均勻、階梯覆蓋好。
      - **PECVD 電漿輔助 CVD**：用電漿降低溫度，常用於後段（金屬層之後）。
      - **ALD 原子層沉積**：每個循環長一層原子，厚度可精準控制，覆蓋近乎 100%。
      - **PVD 物理氣相沉積（濺鍍）**：粒子直線射出，階梯覆蓋差，常用於金屬膜。
  - label: "Material"
    help: |
      **Material 沉積材料**：可選項目隨製程類型改變
      （例：ALD 可沉積 HfO₂、Al₂O₃、TiN；PVD 可沉積 Al、TiN、W）。
  - label: "Temperature (C)"
    min: 100
    max: 900
    help: |
      **Temperature 沉積溫度**：基板溫度。
      沉積速率隨溫度呈指數上升（R ∝ exp(−Ea/k_B·T)）。右圖的對數軸上近似一條直線。
  - label: "Pressure (Torr)"
    help: |
      **Pressure 前驅物分壓**：反應氣體的壓力，速率與它成正比（R ∝ P）。
      對 ALD 與 PVD 影響較小（由自限制反應或濺鍍功率主導）。
  - label: "Time (min or cycles for ALD)"
    help: |
      **Time 沉積時間**：CVD／PVD 為分鐘；**ALD 則為循環數**。
      厚度 = 速率 × 時間（ALD：每循環厚度 × 循環數）。
  - label: "Feature aspect ratio"
    help: |
      **Feature aspect ratio 深寬比**：結構深度 ÷ 寬度。
      深寬比越大，越難讓氣體到達溝槽底部，階梯覆蓋率越低（DRAM 電容孔洞是高深寬比的例子）。
  - label: "Temperature delta for stress (K)"
    help: |
      **Temperature delta 溫差 ΔT**：沉積溫度到室溫的溫度變化（降溫為負值）。
      用於熱應力：σ_thermal = E/(1−ν) · (α_膜 − α_基板) · ΔT。
      總應力 = 本質應力 + 熱應力；正值為張應力、負值為壓應力。

  # ------------------------------------------------------------------ Data Generator (feeds the SPC page)
  - label: "Number of lots"
    help: "**Number of lots 批數**：模擬幾個 lot。越多，SPC 圖的點越多、趨勢越明顯。"
  - label: "Wafers per lot"
    help: "**Wafers per lot 每批晶圓數**：一個 lot 的晶圓片數（實際廠內通常 25 片）。"
  - label: "Drift rate"
    help: |
      **Drift rate 漂移率**：每個 lot 的製程平均值做隨機漫步時，每步標準差佔製程 σ 的比例
      （0.05 = 5% σ／lot）。越大，lot 之間的平均值飄得越遠，SPC 越容易出現趨勢與異常。
  - label: "Aging factor"
    help: |
      **Aging factor 老化因子**：機台每個 lot 劣化的比例（0.002 = 0.2%／lot）。
      影響蝕刻速率與沉積均勻性，造成緩慢單向的漂移（類似兩次 PM 之間的變化）。
  - label: "Random seed"
    help: "**Random seed 亂數種子**：相同的種子會產生完全相同的資料，方便重現結果。"
  - label: "Generate Dataset"
    help: "產生合成的晶圓廠資料。完成後可到 **SPC Dashboard** 頁面畫管制圖。"

  # ------------------------------------------------------------------ SPC
  - label: "Data source"
    help: "**Data source 資料來源**：使用 Data Generator 產生的資料，或上傳自己的 CSV（至少 10 筆數值）。"
  - label: "Parameter to chart"
    help: |
      **Parameter 管制參數**：要畫管制圖的製程參數，例如 gate_oxide_thickness（閘極氧化層厚度）、poly_cd（線寬 CD）。
      序號欄位（lot_sequence、wafer_sequence 等）已從清單移除：它們只是一直遞增的編號，不是製程參數。
  - label: "USL"
    help: |
      **USL 規格上限 (Upper Specification Limit)**。選好參數後，Metro 說明會自動填入可靠的建議值
      （方法顯示在框下方，游標停在 ? 看計算過程）。若沒有出現建議值，框內是 SemiYield 原本的預設：
      資料的 99.5 百分位，**不是真正的規格**。
  - label: "LSL"
    help: |
      **LSL 規格下限 (Lower Specification Limit)**。同 USL：選好參數後自動填入建議值；
      若沒有建議值，框內是資料的 0.5 百分位，**不是真正的規格**。

  # ------------------------------------------------------------------ metric cards
  - label: "Final Thickness"
    help: "**Final Thickness 最終氧化層厚度**：在「Max time」時間結束時的氧化層厚度（Deal-Grove 模型）。"
  - label: "Junction Depth"
    help: |
      **Junction Depth 接面深度 xj**：植入濃度降到與背景摻雜相等的深度，
      即 pn 接面位置。N/A 表示劑量太低，植入濃度從未超過背景。
  - label: "SiO2 etch rate"
    help: "**SiO₂ 蝕刻速率**：目前壓力與溫度下，氧化矽每分鐘被蝕刻的厚度。"
  - label: "Si etch rate"
    help: "**Si 蝕刻速率**：目前壓力與溫度下，矽每分鐘被蝕刻的厚度。"
  - label: "SiO2/Si selectivity"
    help: |
      **Selectivity 選擇比** = SiO₂ 蝕刻速率 ÷ Si 蝕刻速率。
      比值越高，蝕刻氧化層時越不會傷到下方的矽（例如蝕刻接觸孔時停在矽表面）。
  - label: "Deposited thickness"
    help: "**Deposited thickness 沉積厚度** = 沉積速率 × 時間（ALD 為每循環厚度 × 循環數）。"
  - label: "Step coverage"
    help: |
      **Step coverage 階梯覆蓋率**：溝槽側壁／底部的膜厚 ÷ 表面膜厚。
      100% 為完全保形（ALD 接近）；PVD 因直線射出，覆蓋率低。
  - label: "Non-uniformity (1s)"
    help: |
      **Non-uniformity 不均勻度（1σ）**：整片 300 mm 晶圓上膜厚的標準差 ÷ 平均值（%）。
      越小越均勻；此為經驗模型的估計，不是量測值。
  - label: "Film stress"
    help: |
      **Film stress 薄膜應力**（MPa）：本質應力 + 熱應力。
      **正值＝張應力 (tensile)**，**負值＝壓應力 (compressive)**。應力過大會造成晶圓翹曲或膜層裂開。
  - label: "Cp"
    help: |
      **Cp 製程能力**（只看變異）= (USL − LSL) ÷ (6σ_within)。
      不考慮平均值有沒有偏離中心。σ_within 由相鄰點的移動全距估計（短期變異）。
  - label: "Cpk"
    help: |
      **Cpk** 同時考慮變異與偏離中心 = min(USL − μ, μ − LSL) ÷ (3σ_within)。
      常見要求：**≥ 1.33**；< 1.0 表示有明顯比例的產品會超出規格。
  - label: "Pp"
    help: "**Pp 製程績效**（只看變異）= (USL − LSL) ÷ (6σ_overall)。σ_overall 是全部資料的標準差（含長期漂移）。"
  - label: "Ppk"
    help: |
      **Ppk** = min(USL − μ, μ − LSL) ÷ (3σ_overall)，用長期總變異。
      若 Ppk 明顯低於 Cpk，代表製程在 lot 之間有漂移，短期看不出來。
  - label: "Sigma level"
    help: "**Sigma level**：平均值到最近規格界限的距離，以 σ_within 為單位。數值越大，離規格越遠、越安全。"

  # ------------------------------------------------------------------ Data Generator (charts section)
  - label: "Parameter"
    kind: selectbox
    help: "**Parameter 參數**：選擇要看「每批平均值隨時間變化」的製程參數。漂移（Drift rate）與老化（Aging factor）會在這張趨勢圖上出現。"
  - label: "Select wafer"
    help: "**Select wafer 選擇晶圓**：畫出這片晶圓的局部良率晶圓圖（只列出前 50 片）。"
  - label: "Process Parameter Trends"
    kind: subheader
    help: "每個 lot 的平均值隨時間（lot 順序）的變化。慢慢飄＝lot 間漂移；單向持續變化＝機台老化。"
  - label: "Wafer Map"
    kind: subheader
    help: "單片晶圓的局部良率分布（模擬）。綠色高、紅色低；四角為晶圓外，畫成 0。"

  # ------------------------------------------------------------------ Yield Prediction
  - label: "Training Configuration"
    kind: subheader
    help: |
      **訓練設定**：用 Data Generator 的資料訓練「由製程參數預測良率」的模型。
      模型為堆疊集成（stacking）：隨機森林 + XGBoost（未安裝則改用第二個隨機森林）+ LSTM（未安裝 PyTorch 則略過），
      再用 Ridge 迴歸學習各模型的權重。
  - label: "Test set fraction"
    help: |
      **Test set fraction 測試集比例**：資料**最後**這個比例的晶圓（依時間順序）留作測試，不參與訓練。
      依時間切分比隨機切分更接近真實情況：「用過去的資料預測未來」。
  - label: "Number of trees (RF/XGB)"
    help: "**Number of trees 樹的數量**：隨機森林與 XGBoost 中決策樹的數目。越多通常越穩定，但訓練越慢。"
  - label: "Train Ensemble Model"
    help: "開始訓練集成模型，並計算 SHAP 特徵重要度（需要數十秒）。"
  - label: "R2"
    help: |
      **R² 決定係數**：模型解釋了測試集良率變異的比例。1 = 完美，0 = 跟直接猜平均值一樣，負值 = 比猜平均值還差。
      測試集是**最新**的 20% 晶圓，模型從未看過。
      Metro 修正：SemiYield 原本用很小的驗證集學集成權重（例如 −0.11 與 +1.76），會把預測的良率下降放大約 1.65 倍，
      預設資料下 R² 為 −1.47。改成「非負、總和為 1」的權重並用全部訓練資料重訓後約為 0.8（8 個亂數種子平均 0.18 → 0.80）。
  - label: "RMSE"
    help: "**RMSE 均方根誤差**：預測良率與實際良率差距的典型大小（與良率同單位，0–1）。越小越好；對大誤差較敏感。"
  - label: "MAE"
    help: "**MAE 平均絕對誤差**：預測良率與實際良率差距的平均（0–1）。越小越好；比 RMSE 不受少數大誤差影響。"
  - label: "Feature Importance (SHAP)"
    kind: subheader
    help: |
      **SHAP 特徵重要度**：每個製程參數對「預測良率」平均貢獻了多少（取絕對值，不分正負）。
      用來找出最值得管控的參數；注意它代表模型學到的關聯，不一定是因果。
  - label: "Predict Yield for Custom Process Parameters"
    kind: subheader
    help: "輸入一組製程參數（預設為資料中位數），用訓練好的模型預測良率。可以試著把某個參數推出規格，看良率怎麼變。"
  - label: "Predicted Yield"
    help: |
      **Predicted Yield 預測良率**：模型對上面這組參數的良率預測（0–1）。
      「± uncertainty」是不確定度：各子模型預測的分散程度，越大代表越不可信（例如輸入超出訓練資料範圍）。

  # ------------------------------------------------------------------ Process Optimizer
  - label: "Parameter Bounds"
    kind: subheader
    help: |
      **參數範圍**：貝氏最佳化會在這個範圍內搜尋最佳條件。
      ⚠ 注意：此頁的「良率」是**示範用的公式**（二次曲面 + 少量雜訊），最佳點固定在你設定範圍的**正中央**，
      不是真實製程資料。適合學習最佳化流程，不適合當作製程結論。
  - label: "Gate oxide time min (s)"
    help: "**閘極氧化時間下限**（秒）。搜尋範圍的下限；示範公式的最佳點在上下限的中點。"
  - label: "Gate oxide time max (s)"
    help: "**閘極氧化時間上限**（秒）。搜尋範圍的上限。"
  - label: "Anneal temp min (C)"
    help: "**退火溫度下限**（°C）。搜尋範圍的下限；示範公式的最佳點在上下限的中點。"
  - label: "Anneal temp max (C)"
    help: "**退火溫度上限**（°C）。搜尋範圍的上限。"
  - label: "Optimization iterations"
    help: |
      **Optimization iterations 最佳化次數**：在 5 個隨機起始點之後，再做幾次「由模型挑選下一個條件」的實驗。
      每一次相當於跑一片實驗晶圓。
  - label: "Run Optimization"
    help: "開始貝氏最佳化：先跑 5 個隨機起始點，再用高斯過程模型逐次挑選最可能改善的條件。"
  - label: "Optimization Results"
    kind: subheader
    help: "目前找到的最佳條件與其良率（來自示範公式，不是真實製程）。"
  - label: "gate_oxide_time"
    kind: metric
    help: "**最佳閘極氧化時間**（秒）：所有實驗中良率最高的那一次所用的條件。"
  - label: "anneal_temp"
    kind: metric
    help: "**最佳退火溫度**（°C）：所有實驗中良率最高的那一次所用的條件。"
  - label: "Best Yield"
    help: "**Best Yield 最佳良率**：所有實驗中觀測到的最高良率（含少量量測雜訊）。"
  - label: "Optimization Convergence"
    kind: subheader
    help: "每一次實驗的良率，以及到目前為止的最佳值。最佳值曲線變平代表已收斂，再多做實驗幫助不大。"
  - label: "Process Window (95% of optimum)"
    kind: subheader
    help: |
      **Process window 製程窗口**：在最佳點附近，模型預測良率仍 ≥ 最佳良率 95% 的參數範圍。
      窗口越寬，代表製程對該參數越不敏感、越好量產。

  # ------------------------------------------------------------------ SPICE Export
  - label: "Process Parameters"
    kind: subheader
    help: "把製程結果（氧化層厚度、通道長度、摻雜、接面深度）轉成電晶體模型參數。這是製程端交給電路設計端的橋樑。"
  - label: "Gate oxide thickness (nm)"
    help: |
      **Gate oxide thickness 閘極氧化層厚度 tox**：越薄，閘極電容 Cox = ε_ox/tox 越大、臨界電壓越低、
      電晶體越快，但漏電越大。這正是膜厚量測要嚴格管控的原因。
  - label: "Channel length (nm)"
    help: "**Channel length 通道長度 Lg**（≈ 閘極線寬 CD）：越短越快，但短通道效應（臨界電壓下降、漏電增加）越明顯。"
  - label: "Substrate doping (log10 cm^-3)"
    help: |
      **Substrate doping 基板摻雜濃度**（以 log10 表示，17 = 10¹⁷ cm⁻³）。
      摻雜越高，臨界電壓越高、遷移率越低。
  - label: "Junction depth (nm)"
    help: "**Junction depth 接面深度 xj**：源／汲極的深度。越淺越能抑制短通道效應，但電阻越大。"
  - label: "Model level"
    help: |
      **Model level 模型版本**：BSIM3v3 或 BSIM4，加州大學柏克萊分校的標準 MOSFET 精簡模型。
      BSIM4 較新，涵蓋更多小尺寸效應。
  - label: "Model name"
    help: "**Model name 模型名稱**：寫進 SPICE 檔中的模型名稱，電路檔用這個名字引用此電晶體模型。"
  - label: "Computed SPICE Parameters"
    kind: subheader
    help: |
      主要 BSIM 參數：
      - **VTH0** 臨界電壓（基板偏壓為 0 時），電晶體開始導通的閘極電壓（V）
      - **TOX** 氧化層厚度（公尺）
      - **U0** 低電場載子遷移率（cm²/V·s），越大電流越大
      - **K1** 一階基板效應係數，基板偏壓對臨界電壓的影響
      - **CDSC** 源汲極與通道的耦合電容，影響次臨界擺幅
      - **RDSW** 源汲極寄生電阻（每單位寬度）
      ⚠ 由教科書公式估算，不是校正過的晶圓廠模型。
  - label: "Download SPICE Files"
    kind: subheader
    help: |
      - **.subckt** 子電路（把電晶體包成可重複使用的元件）
      - **.lib** 模型卡（BSIM 參數）
      - **testbench** 測試電路，可直接用 ngspice 或 LTspice 模擬

charts:
  # ------------------------------------------------------------------ Oxidation
  - match: "^Oxide Growth"
    traces:
      - name: "Thickness"
        hover: >-
          <b>氧化層厚度 Oxide thickness</b><br>
          時間 t = %{x:.1f} min → 厚度 x = <b>%{y:.2f} nm</b><br>
          <i>先快後慢：初期受表面反應限制（近似線性），<br>
          變厚後受氧氣穿過氧化層的擴散限制（近似拋物線）。</i><extra></extra>
  - match: "^Growth Rate vs Time"
    traces:
      - name: "Growth rate"
        hover: >-
          <b>成長速率 Growth rate dx/dt</b><br>
          時間 t = %{x:.1f} min → 速率 = <b>%{y:.3f} nm/min</b><br>
          <i>氧化層越厚，氧氣越難到達 Si/SiO₂ 介面，速率越低。</i><extra></extra>

  # ------------------------------------------------------------------ Implantation
  - match: "implant at"
    traces:
      - name: "profile$"
        hover: >-
          <b>摻雜濃度 Dopant concentration</b><br>
          深度 x = %{x:.1f} nm → N = <b>%{y:.2e} cm⁻³</b>（對數軸）<br>
          <i>峰值位置 ≈ 投影射程 Rp；峰越寬代表 ΔRp 越大。</i><extra></extra>
    lines:
      - text: "^Background"
        hover: >-
          <b>背景摻雜 Background doping</b><br>
          基板原本的濃度（%{y:.2e} cm⁻³）。<br>
          <i>植入曲線與它相交的位置就是接面深度 xj。</i><extra></extra>
      - text: "^xj="
        hover: >-
          <b>接面深度 Junction depth xj</b><br>
          植入濃度 = 背景濃度的位置（x = %{x:.1f} nm）。<br>
          <i>此深度以上為被植入的型態，以下回到基板型態（pn 接面）。</i><extra></extra>

  # ------------------------------------------------------------------ Etching
  - match: "etch rate vs temperature"
    traces:
      - name: "Etch rate vs T"
        hover: >-
          <b>蝕刻速率 Etch rate</b><br>
          溫度 T = %{x:.0f} °C → R = <b>%{y:.1f} nm/min</b><br>
          <i>溫度越高，表面反應越快（Arrhenius）。</i><extra></extra>
  - match: "etch rate vs pressure"
    traces:
      - name: "Rate vs pressure"
        hover: >-
          <b>蝕刻速率 Etch rate</b><br>
          壓力 P = %{x:.0f} mTorr → R = <b>%{y:.1f} nm/min</b><br>
          <i>低壓區近似線性（表面覆蓋率低）；高壓區趨於飽和（表面被反應物佔滿）。</i><extra></extra>

  # ------------------------------------------------------------------ Deposition
  - match: "growth rate vs temperature"
    traces:
      - name: ".*"
        hover: >-
          <b>沉積速率 Deposition rate</b><br>
          溫度 T = %{x:.0f} °C → R = <b>%{y:.3g} nm/min（ALD：nm/循環）</b>（對數軸）<br>
          <i>對數軸上近似直線：斜率由活化能 Ea 決定，Ea 越大，對溫度越敏感。</i><extra></extra>

  # ------------------------------------------------------------------ SPC
  - match: "^I-MR Chart"
    traces:
      - name: ".*"
        status_marker: true
        hover: >-
          <b>第 %{x} 個觀測值 Observation #%{x}</b><br>
          量測值 = <b>%{y:.4g}</b><br>
          狀態：%{customdata}<br>
          <i>紅點＝違反 Western Electric 規則（如 1 點超出 3σ、連續 8 點同側），需要調查原因。</i><extra></extra>
    lines:
      - text: "^CL$"
        hover: >-
          <b>CL 中心線 (Center Line)</b> = %{y:.4g}<br>
          <i>製程平均值。點應隨機分布在它的上下。</i><extra></extra>
      - text: "^UCL$"
        hover: >-
          <b>UCL 管制上限 (Upper Control Limit)</b> = %{y:.4g}<br>
          <i>CL + 3σ。由製程自己的變異算出，<b>不是規格</b>；超出代表製程出現特殊原因。</i><extra></extra>
      - text: "^LCL$"
        hover: >-
          <b>LCL 管制下限 (Lower Control Limit)</b> = %{y:.4g}<br>
          <i>CL − 3σ。由製程變異算出，<b>不是規格</b>。</i><extra></extra>

  # ------------------------------------------------------------------ Data Generator
  - match: "^(?P<param>\\S+) lot mean over time"
    traces:
      - name: ".*"
        hover: >-
          <b>Lot #%{x}</b><br>
          [[param]] 批平均 = <b>%{y:.4g}</b><br>
          <i>[[note]]</i><br>
          <i>慢慢飄移＝lot 間漂移（Drift rate）；單向持續變化＝機台老化（Aging factor）。</i><extra></extra>
  - match: "^Local yield map"
    traces:
      - name: ".*"
        hover: >-
          <b>晶粒位置</b> 第 %{y} 列、第 %{x} 行<br>
          局部良率 = <b>%{z:.2f}</b><br>
          <i>綠＝高、紅＝低；四角的 0 是晶圓外（沒有晶粒）。</i><extra></extra>

  # ------------------------------------------------------------------ Yield Prediction
  - match: "^Feature importance"
    traces:
      - name: ".*"
        customdata: feature_y
        hover: >-
          <b>%{y}</b><br>
          平均 |SHAP| = <b>%{x:.4g}</b><br>
          %{customdata}<br>
          <i>數值越大＝這個參數對預測良率的影響越大（不分正負；代表關聯，不一定是因果）。</i><extra></extra>

  # ------------------------------------------------------------------ Process Optimizer
  - match: "^Bayesian optimization convergence"
    traces:
      - name: "^Observations$"
        hover: >-
          <b>第 %{x} 次實驗</b>（從 0 起算）<br>
          良率 = <b>%{y:.4f}</b><br>
          <i>第 0–4 次是隨機起始點；之後由高斯過程模型挑選最可能改善的條件。</i><br>
          <i>⚠ 良率來自示範公式，不是真實製程。</i><extra></extra>
      - name: "^Best so far$"
        hover: >-
          <b>到第 %{x} 次為止的最佳良率</b> = %{y:.4f}<br>
          <i>曲線變平代表已收斂，再多做實驗幫助不大。</i><extra></extra>

# Process-parameter names used by SemiYield's data (column names). Used for the Yield Prediction inputs,
# the SHAP bars, the Data Generator trend chart and the caption under the SPC parameter selector.
features:
  gate_oxide_thickness: {zh: "閘極氧化層厚度", unit: "nm", note: "電晶體閘極下的 SiO₂ 厚度，決定閘極電容與臨界電壓；標稱 8.5 nm。"}
  poly_cd: {zh: "多晶矽閘極線寬 CD", unit: "nm", note: "閘極的關鍵尺寸（約等於通道長度），越小越快但漏電越大；標稱 90 nm。"}
  implant_dose: {zh: "植入劑量", unit: "cm⁻²", note: "每平方公分植入的離子數，決定摻雜濃度與臨界電壓；標稱 1×10¹³。"}
  anneal_temp: {zh: "退火溫度", unit: "°C", note: "植入後活化摻雜物、修復晶格損傷的溫度；標稱 1000 °C。"}
  metal_resistance: {zh: "金屬片電阻", unit: "Ω/□", note: "金屬導線層的片電阻，偏高表示膜太薄或材料問題；標稱 0.08。"}
  contact_resistance: {zh: "接觸電阻", unit: "Ω", note: "金屬與矽之間接觸孔的電阻，過高會拖慢電路；標稱 15 Ω。"}
  etch_rate: {zh: "蝕刻速率", unit: "nm/min", note: "每分鐘蝕刻的厚度；機台老化會使它逐漸下降。標稱 120。"}
  deposition_unif: {zh: "沉積不均勻度", unit: "% 1σ", note: "整片晶圓膜厚的 1σ 不均勻度，越小越好；機台老化會使它變差。標稱 2%。"}
  defect_density: {zh: "缺陷密度", unit: "個/cm²", note: "每平方公分的致命缺陷數，越小越好；透過 Murphy 模型降低良率。"}
  yield: {zh: "良率", unit: "0–1", note: "合格晶粒比例 = 參數良率 × 缺陷良率（Murphy 模型）。是結果指標，不是製程參數。"}
  wafer_map_mean: {zh: "晶圓圖平均局部良率", unit: "0–1", note: "晶圓圖上各晶粒局部良率的平均。"}
  wafer_map_std: {zh: "晶圓圖局部良率標準差", unit: "", note: "晶圓圖上良率的分散程度，越大代表空間不均勻越嚴重。"}
  lot_sequence: {zh: "批次序號", unit: "", note: "只是 lot 的順序編號，不是製程參數。"}
  wafer_sequence: {zh: "晶圓序號", unit: "", note: "只是晶圓的順序編號，不是製程參數。"}
