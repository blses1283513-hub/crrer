# Metro AE glossary: single source for the Eudic files.
# Edit here, then run:  python -m metro_toolkit.eudic
#
# Fields
#   en     English term (headword)            zh     Traditional Chinese (Taiwan fab usage)
#   note   one-line explanation (繁中)        ex     example sentence (English)
#   ex_zh  translation of the example         tools  which tool(s) the term belongs to
# Tool keys: mt = metro-toolkit, sy = SemiYield, wl = WaferLens, st = sem-toolkit
# Example sentences are original, written in the style of each tool's docs (not copied).

terms:
  # ------------------------------------------------------------------ optics / thin film
  - en: "metrology"
    zh: "量測（計量）"
    note: "以量測確認製程結果是否符合規格的工程領域；Metro 即 metrology 的簡稱。"
    ex: "Metrology confirms that every deposition step lands on target before the lot moves on."
    ex_zh: "量測確認每一道沉積步驟都達到目標值，lot 才能往下一站走。"
    tools: [mt, st]
  - en: "applications engineer"
    zh: "應用工程師"
    note: "負責量測 recipe 開發、機台能力驗證與量測問題排除的工程師。"
    ex: "The applications engineer released a new thickness recipe after the gauge study passed."
    ex_zh: "量具研究通過後，應用工程師發行了新的膜厚 recipe。"
    tools: [mt]
  - en: "thin film"
    zh: "薄膜"
    note: "厚度從次奈米到微米的沉積或成長層，如氧化層、氮化矽、high-k。"
    ex: "Each thin film in the stack is modelled with its own thickness and dispersion law."
    ex_zh: "堆疊中的每一層薄膜都用各自的厚度與色散模型來描述。"
    tools: [mt, sy, st]
  - en: "film thickness"
    zh: "膜厚"
    note: "最常見的薄膜量測參數，單位多為 nm 或 Å。"
    ex: "Film thickness is fitted at 49 sites to build the wafer map."
    ex_zh: "在 49 個量測點擬合膜厚，以建立晶圓圖。"
    tools: [mt, sy, wl, st]
  - en: "film stack"
    zh: "膜層堆疊"
    note: "由上而下的多層薄膜結構，最底層為基板。"
    ex: "The film stack is listed from the ambient side down to the silicon substrate."
    ex_zh: "膜層堆疊從環境介質側往下列到矽基板。"
    tools: [mt]
  - en: "substrate"
    zh: "基板"
    note: "薄膜下方視為半無限厚的材料，量測監控片通常為矽基板。"
    ex: "Light that reaches the substrate is either reflected back or absorbed."
    ex_zh: "到達基板的光不是被反射回來就是被吸收。"
    tools: [mt, st]
  - en: "ambient medium"
    zh: "環境介質"
    note: "光入射前所在的介質，一般為空氣（n = 1）。"
    ex: "Setting the ambient medium to n = 1.5 instead of air shifts every reflectance curve."
    ex_zh: "把環境介質設成 n = 1.5 而不是空氣，會讓每一條反射率曲線都偏移。"
    tools: [mt, st]
  - en: "monitor wafer"
    zh: "監控片"
    note: "不做產品、專門跑製程後量測膜厚或微粒的空白晶圓。"
    ex: "Blanket monitor wafers make the optical model much simpler than patterned product."
    ex_zh: "空白監控片讓光學模型比圖案化的產品片簡單得多。"
    tools: [mt]
  - en: "reflectometry"
    zh: "反射光譜量測"
    note: "量測反射率隨波長變化來推算膜厚，常為正向入射。"
    ex: "Normal-incidence reflectometry loses sensitivity on oxides thinner than a few nanometres."
    ex_zh: "正向入射的反射光譜量測在數奈米以下的氧化層會失去靈敏度。"
    tools: [mt, st]
  - en: "reflectance"
    zh: "反射率"
    note: "反射光強與入射光強之比，介於 0 與 1 之間。"
    ex: "Bare silicon has a reflectance of about 0.35 at 633 nm."
    ex_zh: "裸矽在 633 nm 的反射率約為 0.35。"
    tools: [mt, st]
  - en: "spectroscopic ellipsometry"
    zh: "光譜式橢圓偏光術（SE）"
    note: "量測反射光偏振態的變化（Ψ、Δ），對極薄膜最靈敏。"
    ex: "Spectroscopic ellipsometry resolves sub-angstrom changes in a 2 nm gate oxide."
    ex_zh: "光譜式橢圓偏光術可以分辨 2 nm 閘極氧化層中小於 1 埃的變化。"
    tools: [mt, st]
  - en: "Psi and Delta"
    zh: "Ψ 與 Δ（橢偏參數）"
    note: "ρ = rp/rs = tanΨ·e^{iΔ}；Ψ 為振幅比，Δ 為相位差。"
    ex: "Psi and Delta are measured at three angles and fitted together."
    ex_zh: "在三個角度量測 Ψ 與 Δ，並一起擬合。"
    tools: [mt, st]
  - en: "angle of incidence"
    zh: "入射角"
    note: "入射光與表面法線的夾角；SE 常用 65°–75°。"
    ex: "Using several angles of incidence reduces correlation between fitted parameters."
    ex_zh: "使用多個入射角可以降低擬合參數之間的相關性。"
    tools: [mt, st]
  - en: "polarization"
    zh: "偏振"
    note: "光電場振動方向；s 偏振垂直入射面，p 偏振平行入射面。"
    ex: "Ellipsometry needs both s and p polarization at the same angle."
    ex_zh: "橢圓偏光術需要同一角度下的 s 與 p 兩種偏振。"
    tools: [mt, st]
  - en: "Brewster angle"
    zh: "布魯斯特角"
    note: "p 偏振反射率為零的入射角，tanθ = n2/n1。"
    ex: "On a bare glass substrate Psi drops to zero at the Brewster angle."
    ex_zh: "在裸玻璃基板上，Ψ 在布魯斯特角降為零。"
    tools: [mt]
  - en: "Fresnel coefficients"
    zh: "菲涅耳係數"
    note: "介面上反射／穿透的複數振幅比，分 rs 與 rp。"
    ex: "The model returns the complex Fresnel coefficients of the whole stack."
    ex_zh: "模型回傳整個膜層堆疊的複數菲涅耳係數。"
    tools: [mt]
  - en: "transfer matrix method"
    zh: "傳輸矩陣法（TMM）"
    note: "以每層 2×2 矩陣相乘計算多層膜光學響應的方法。"
    ex: "The transfer matrix method handles any number of planar layers."
    ex_zh: "傳輸矩陣法可以處理任意層數的平面膜層。"
    tools: [mt, st]
  - en: "interference fringe"
    zh: "干涉條紋"
    note: "上下介面反射光相互干涉，使光譜出現週期性起伏。"
    ex: "A thicker film produces more interference fringes across the same wavelength range."
    ex_zh: "膜越厚，在相同波長範圍內出現的干涉條紋越多。"
    tools: [mt]
  - en: "refractive index"
    zh: "折射率（n）"
    note: "光在材料中速度的倒數比；SiO2 約 1.46，Si3N4 約 2.0。"
    ex: "A refractive index shift often signals a change in film composition."
    ex_zh: "折射率偏移常代表薄膜組成發生變化。"
    tools: [mt, sy, st]
  - en: "extinction coefficient"
    zh: "消光係數（k）"
    note: "複數折射率的虛部，代表材料吸收光的強弱。"
    ex: "Silicon has a large extinction coefficient in the ultraviolet."
    ex_zh: "矽在紫外光區有很大的消光係數。"
    tools: [mt, st]
  - en: "optical constants"
    zh: "光學常數（n, k）"
    note: "材料的折射率與消光係數，隨波長而變。"
    ex: "Replace the typical optical constants with the values your recipe actually uses."
    ex_zh: "請把典型的光學常數換成你 recipe 實際使用的數值。"
    tools: [mt, st]
  - en: "dispersion model"
    zh: "色散模型"
    note: "描述 n、k 隨波長變化的數學模型。"
    ex: "Each material is assigned a dispersion model in films.yaml."
    ex_zh: "每一種材料都在 films.yaml 中指定一個色散模型。"
    tools: [mt]
  - en: "Cauchy model"
    zh: "柯西模型"
    note: "n = A + B/λ² + C/λ⁴，適用於透明介電質。"
    ex: "The Cauchy model is a good choice for transparent ALD oxides."
    ex_zh: "柯西模型很適合用於透明的 ALD 氧化物。"
    tools: [mt]
  - en: "Sellmeier equation"
    zh: "塞爾邁爾方程式"
    note: "以共振項描述折射率的色散公式，常用於 SiO2、Si3N4。"
    ex: "SiO2 uses the Malitson Sellmeier equation for fused silica."
    ex_zh: "SiO2 使用 Malitson 的熔融石英塞爾邁爾方程式。"
    tools: [mt]
  - en: "Tauc-Lorentz model"
    zh: "Tauc-Lorentz 模型"
    note: "描述非晶半導體吸收的色散模型，含能隙 Eg。"
    ex: "Amorphous silicon is described with a Tauc-Lorentz oscillator."
    ex_zh: "非晶矽用 Tauc-Lorentz 振子來描述。"
    tools: [mt]
  - en: "Kramers-Kronig relations"
    zh: "克拉莫-克若尼關係"
    note: "連結介電函數實部與虛部的因果關係式。"
    ex: "The real part of the permittivity follows from the Kramers-Kronig relations."
    ex_zh: "介電函數的實部可由克拉莫-克若尼關係求得。"
    tools: [mt]
  - en: "band gap"
    zh: "能隙"
    note: "材料開始吸收光的最低光子能量。"
    ex: "Below the band gap the film is transparent and k is zero."
    ex_zh: "低於能隙時薄膜是透明的，k 為零。"
    tools: [mt]
  - en: "model-based fitting"
    zh: "模型擬合"
    note: "調整模型參數使模擬光譜與量測光譜吻合，是膜厚量測的核心。"
    ex: "Thickness is not measured directly; it comes from model-based fitting."
    ex_zh: "膜厚不是直接量到的，而是由模型擬合得到。"
    tools: [mt]
  - en: "global search"
    zh: "全域搜尋"
    note: "先在整個範圍粗掃，避免落入局部極小值。"
    ex: "A global search scans the whole thickness range before local refinement."
    ex_zh: "全域搜尋會先掃過整個膜厚範圍，再做局部精修。"
    tools: [mt]
  - en: "local minimum"
    zh: "局部極小值"
    note: "擬合誤差的假最低點，會給出看似合理但錯誤的膜厚。"
    ex: "A local fit started at 530 nm stopped in a local minimum at 538.7 nm."
    ex_zh: "從 530 nm 開始的局部擬合停在 538.7 nm 的局部極小值。"
    tools: [mt, st]
  - en: "least squares"
    zh: "最小平方法"
    note: "使殘差平方和最小的擬合方法。"
    ex: "Each candidate basin is refined with bounded least squares."
    ex_zh: "每個候選區域都用有界的最小平方法進行精修。"
    tools: [mt]
  - en: "residual"
    zh: "殘差"
    note: "量測值減去模型值。"
    ex: "Structured residuals mean the optical model is missing a layer."
    ex_zh: "殘差若有規律，代表光學模型少了一層。"
    tools: [mt]
  - en: "reduced chi-square"
    zh: "縮減卡方"
    note: "以自由度與雜訊正規化的擬合誤差；≈1 表示擬合與雜訊一致。"
    ex: "A reduced chi-square far above 1 points to a wrong stack model."
    ex_zh: "縮減卡方遠大於 1 表示膜層模型有誤。"
    tools: [mt]
  - en: "goodness of fit"
    zh: "擬合優度"
    note: "評估模型與資料吻合程度的指標，如 χ²、R²。"
    ex: "Sites with poor goodness of fit are flagged instead of reported."
    ex_zh: "擬合優度差的量測點會被標記，而不是直接回報。"
    tools: [mt]
  - en: "standard error"
    zh: "標準誤差"
    note: "參數估計值的 1σ 不確定度；只涵蓋雜訊，不涵蓋模型錯誤。"
    ex: "The reported standard error stayed at 0.001 nm even when the IL was wrong."
    ex_zh: "即使介面層設錯，回報的標準誤差仍停在 0.001 nm。"
    tools: [mt]
  - en: "parameter correlation"
    zh: "參數相關性"
    note: "兩個擬合參數互相補償的程度；|r| 接近 1 時無法同時浮動。"
    ex: "Thickness and n show a parameter correlation above 0.99 on a 2 nm film."
    ex_zh: "在 2 nm 的薄膜上，膜厚與 n 的參數相關性超過 0.99。"
    tools: [mt]
  - en: "floated parameter"
    zh: "浮動參數"
    note: "擬合時允許改變的參數；其餘為固定參數。"
    ex: "Only the top layer thickness is a floated parameter in this recipe."
    ex_zh: "這個 recipe 中只有最上層膜厚是浮動參數。"
    tools: [mt]
  - en: "sensitivity"
    zh: "靈敏度"
    note: "訊號對參數變化的響應大小，決定可達到的量測精度。"
    ex: "The sensitivity study shows why SE is chosen for films below 5 nm."
    ex_zh: "靈敏度研究說明了為什麼 5 nm 以下的薄膜選用 SE。"
    tools: [mt]
  - en: "underlayer"
    zh: "下層膜"
    note: "被量測膜下方的膜層；若固定值有誤，會轉嫁到上層結果。"
    ex: "An error in the fixed underlayer transfers into the floated layer without raising chi-square."
    ex_zh: "固定的下層膜若有誤差，會轉嫁到浮動層，而卡方不會升高。"
    tools: [mt]
  - en: "interfacial layer"
    zh: "介面層（IL）"
    note: "high-k 與矽之間的薄 SiO2 層，約 0.5–1 nm。"
    ex: "The interfacial layer is pre-measured before the high-k deposition."
    ex_zh: "介面層會在 high-k 沉積前先量測。"
    tools: [mt]
  - en: "high-k dielectric"
    zh: "高介電常數介電質（high-k）"
    note: "如 HfO2、ZrO2，用於閘極或 DRAM 電容。"
    ex: "The high-k dielectric is floated while the interfacial layer stays fixed."
    ex_zh: "高介電常數介電質設為浮動，介面層保持固定。"
    tools: [mt, sy]
  - en: "gate oxide"
    zh: "閘極氧化層"
    note: "電晶體閘極下的薄氧化層，常只有數奈米。"
    ex: "A gate oxide of 1.8 nm is measured with multi-angle SE."
    ex_zh: "1.8 nm 的閘極氧化層用多角度 SE 量測。"
    tools: [mt, sy, st]
  - en: "silicon nitride"
    zh: "氮化矽（Si3N4）"
    note: "常作硬遮罩、間隙壁、保護層，n 約 2.0。"
    ex: "Silicon nitride on pad oxide is fitted as a two-layer model."
    ex_zh: "墊氧化層上的氮化矽用兩層模型擬合。"
    tools: [mt, sy, st]
  - en: "silicon dioxide"
    zh: "二氧化矽（SiO2）"
    note: "最常見的介電質薄膜，可熱成長或沉積。"
    ex: "Thermal silicon dioxide is the classic metrology reference film."
    ex_zh: "熱成長二氧化矽是經典的量測參考膜。"
    tools: [mt, sy, st]
  - en: "amorphous silicon"
    zh: "非晶矽（a-Si）"
    note: "無長程有序的矽，吸收比結晶矽強。"
    ex: "Amorphous silicon absorbs strongly in the blue part of the spectrum."
    ex_zh: "非晶矽在光譜的藍光區有很強的吸收。"
    tools: [mt, sy]
  - en: "ONO stack"
    zh: "ONO 堆疊（氧化-氮化-氧化）"
    note: "SiO2/Si3N4/SiO2 三層結構。"
    ex: "In the ONO stack, the top oxide and nitride thicknesses are floated."
    ex_zh: "在 ONO 堆疊中，上層氧化層與氮化層的膜厚設為浮動。"
    tools: [mt]
  - en: "capacitor dielectric"
    zh: "電容介電層"
    note: "DRAM 儲存電容中的絕緣層，如 ZrO2/Al2O3/ZrO2（ZAZ）。"
    ex: "The ZAZ capacitor dielectric is only about 5 nm thick in total."
    ex_zh: "ZAZ 電容介電層總厚度只有約 5 nm。"
    tools: [mt]
  - en: "hard mask"
    zh: "硬遮罩"
    note: "蝕刻時保護下層圖形的無機薄膜，如氮化矽。"
    ex: "The nitride hard mask thickness sets the etch budget."
    ex_zh: "氮化矽硬遮罩的厚度決定了蝕刻餘裕。"
    tools: [mt]
  - en: "recipe"
    zh: "Recipe（配方／程式）"
    note: "機台執行的參數設定；量測 recipe 含膜層模型與取樣計畫。"
    ex: "The metrology recipe stores the stack model, fit settings, and sampling plan."
    ex_zh: "量測 recipe 儲存膜層模型、擬合設定與取樣計畫。"
    tools: [mt, wl]
  - en: "recipe release"
    zh: "Recipe 發行"
    note: "完成驗證後正式交給產線使用。"
    ex: "Recipe release requires a passing gauge R&R and a matching study."
    ex_zh: "Recipe 發行需要通過 GR&R 與機台匹配研究。"
    tools: [mt]
  - en: "precision"
    zh: "精密度"
    note: "重複量測的分散程度，常以 3σ 表示；不等於準確度。"
    ex: "Precision is quoted as three sigma of repeated measurements."
    ex_zh: "精密度以重複量測的三倍標準差表示。"
    tools: [mt]
  - en: "accuracy"
    zh: "準確度"
    note: "量測值與真值的接近程度。"
    ex: "Good precision does not guarantee accuracy if the model is biased."
    ex_zh: "如果模型有偏差，精密度好並不保證準確度好。"
    tools: [mt]

  # ------------------------------------------------------------------ wafer
  - en: "wafer map"
    zh: "晶圓圖"
    note: "量測值或良率在晶圓上的空間分布圖。"
    ex: "The wafer map shows a thinner ring near the edge."
    ex_zh: "晶圓圖顯示靠近邊緣有一圈較薄。"
    tools: [mt, sy, wl, st]
  - en: "sampling plan"
    zh: "取樣計畫"
    note: "每片量哪些點、每批量幾片的規定。"
    ex: "The 49-point sampling plan uses three rings around a centre site."
    ex_zh: "49 點取樣計畫在中心點外圍佈三圈。"
    tools: [mt, wl]
  - en: "measurement site"
    zh: "量測點"
    note: "晶圓上一個量測位置，以 (x, y) 座標表示。"
    ex: "Each measurement site is stored as one row in the long-format table."
    ex_zh: "每一個量測點在長表格中存成一列。"
    tools: [mt, wl]
  - en: "edge exclusion"
    zh: "邊緣排除"
    note: "晶圓最外圈不量測的寬度，常為 2–3 mm。"
    ex: "With 3 mm edge exclusion the outer ring sits at 147 mm radius."
    ex_zh: "邊緣排除 3 mm 時，最外圈位於半徑 147 mm。"
    tools: [mt, st]
  - en: "within-wafer uniformity"
    zh: "片內均勻性"
    note: "同一片晶圓上量測值的變異，常以 1σ% 表示。"
    ex: "Within-wafer uniformity is charted alongside the wafer mean."
    ex_zh: "片內均勻性與晶圓平均值一起繪製管制圖。"
    tools: [mt, sy, st]
  - en: "non-uniformity"
    zh: "不均勻度（NU）"
    note: "常見定義：1σ/mean、range/mean、(max−min)/(2·mean)。"
    ex: "Always state which non-uniformity definition a report uses."
    ex_zh: "報告中一定要說明使用哪一種不均勻度定義。"
    tools: [mt, sy, st]
  - en: "wafer-to-wafer variation"
    zh: "片間變異"
    note: "不同晶圓平均值之間的變異。"
    ex: "Wafer-to-wafer variation is larger than site noise in this chamber."
    ex_zh: "這個腔體的片間變異大於量測點雜訊。"
    tools: [mt, wl]
  - en: "center-to-edge"
    zh: "中心到邊緣差"
    note: "邊緣平均值減中心值，用來描述碗形或圓頂形分布。"
    ex: "A negative center-to-edge value means the edge is thinner."
    ex_zh: "中心到邊緣差為負值代表邊緣較薄。"
    tools: [mt]
  - en: "radial profile"
    zh: "徑向分布"
    note: "量測值隨半徑變化的曲線。"
    ex: "The radial profile drops sharply beyond 130 mm."
    ex_zh: "徑向分布在 130 mm 以外急遽下降。"
    tools: [mt, wl]
  - en: "spatial signature"
    zh: "空間特徵（signature）"
    note: "晶圓圖的典型形狀，可追溯到製程或機台原因。"
    ex: "Each chamber leaves its own spatial signature on the wafer."
    ex_zh: "每個腔體都會在晶圓上留下自己的空間特徵。"
    tools: [mt, wl, st]
  - en: "Zernike polynomials"
    zh: "澤尼克多項式"
    note: "圓形區域上的正交多項式，用來分解晶圓圖成傾斜、碗形等成分。"
    ex: "Zernike polynomials turn a 49-point map into a few meaningful numbers."
    ex_zh: "澤尼克多項式把 49 點晶圓圖轉成幾個有意義的數字。"
    tools: [mt]
  - en: "tilt"
    zh: "傾斜"
    note: "晶圓一側高一側低的線性梯度，常與氣流或載台有關。"
    ex: "A left-to-right tilt suggests an asymmetric gas flow."
    ex_zh: "左右方向的傾斜暗示氣流不對稱。"
    tools: [mt]
  - en: "bowl"
    zh: "碗形（中心厚邊緣薄或反之）"
    note: "對稱的二次方徑向分布，常與溫度或電漿密度有關。"
    ex: "A bowl excursion barely moves the wafer mean."
    ex_zh: "碗形異常幾乎不會改變晶圓平均值。"
    tools: [mt]
  - en: "edge roll-off"
    zh: "邊緣下滑"
    note: "最外圈突然變薄的現象。"
    ex: "Edge roll-off appears only in the outermost ring of sites."
    ex_zh: "邊緣下滑只出現在最外圈的量測點。"
    tools: [mt]
  - en: "interpolation"
    zh: "內插"
    note: "由離散量測點估計其他位置的值，用於繪製等高線圖。"
    ex: "Thin-plate-spline interpolation fills the map between sites."
    ex_zh: "薄板樣條內插填補量測點之間的晶圓圖。"
    tools: [mt]
  - en: "contour plot"
    zh: "等高線圖"
    note: "以等值線或色階呈現二維分布。"
    ex: "The contour plot uses a single blue scale for thickness."
    ex_zh: "等高線圖用單一藍色色階表示膜厚。"
    tools: [mt, st]
  - en: "die"
    zh: "晶粒"
    note: "晶圓上切割後的單一晶片。"
    ex: "Each die on the wafer map is coloured by its sort bin."
    ex_zh: "晶圓圖上的每顆晶粒依照其電測分類著色。"
    tools: [sy, wl, st]
  - en: "notch"
    zh: "缺口（晶圓定位）"
    note: "晶圓邊緣用來定位方向的小缺口。"
    ex: "Site coordinates are defined relative to the notch direction."
    ex_zh: "量測點座標是相對於缺口方向定義的。"
    tools: [mt]

  # ------------------------------------------------------------------ MSA
  - en: "measurement system analysis"
    zh: "量測系統分析（MSA）"
    note: "評估量測系統是否足夠好、能否用於管制與決策。"
    ex: "Measurement system analysis comes before any SPC chart is trusted."
    ex_zh: "在信任任何 SPC 管制圖之前，要先做量測系統分析。"
    tools: [mt]
  - en: "gauge R&R"
    zh: "量具重複性與再現性（GR&R）"
    note: "以變異數分析拆解量測變異為重複性與再現性。"
    ex: "The gauge R&R study used ten wafers, three tools, and three repeats."
    ex_zh: "GR&R 研究使用十片晶圓、三台機台、重複三次。"
    tools: [mt]
  - en: "repeatability"
    zh: "重複性"
    note: "同一機台、同一條件下重複量測的變異。"
    ex: "Static repeatability is measured without unloading the wafer."
    ex_zh: "靜態重複性是在不退片的情況下量測。"
    tools: [mt]
  - en: "reproducibility"
    zh: "再現性"
    note: "不同機台、人員或時間下量測的變異。"
    ex: "Reproducibility here is driven by tool-to-tool offsets."
    ex_zh: "這裡的再現性主要來自機台之間的偏移。"
    tools: [mt]
  - en: "dynamic repeatability"
    zh: "動態重複性"
    note: "包含進退片（load/unload）的重複量測變異。"
    ex: "Dynamic repeatability adds placement and focus errors to static noise."
    ex_zh: "動態重複性在靜態雜訊之外還加上放片與對焦誤差。"
    tools: [mt]
  - en: "long-term stability"
    zh: "長期穩定性"
    note: "以標準片每天量測數週，檢查漂移。"
    ex: "The long-term stability study found a significant drift of 1.3 pm per day."
    ex_zh: "長期穩定性研究發現每天 1.3 pm 的顯著漂移。"
    tools: [mt]
  - en: "precision-to-tolerance ratio"
    zh: "精密度公差比（P/T）"
    note: "k·σ量測 /（USL − LSL）；< 10% 可接受，10–30% 有條件接受。"
    ex: "A precision-to-tolerance ratio of 9.7% is acceptable."
    ex_zh: "9.7% 的精密度公差比是可接受的。"
    tools: [mt]
  - en: "number of distinct categories"
    zh: "可區分類別數（ndc）"
    note: "1.41 × σ零件 / σGR&R；應 ≥ 5。"
    ex: "An ndc of 27 means the gauge easily separates the wafers."
    ex_zh: "ndc 為 27 代表量具能輕易區分這些晶圓。"
    tools: [mt]
  - en: "analysis of variance"
    zh: "變異數分析（ANOVA）"
    note: "把總變異拆解成各來源的統計方法。"
    ex: "The ANOVA method pools the interaction term when it is not significant."
    ex_zh: "ANOVA 方法在交互作用不顯著時將其合併。"
    tools: [mt]
  - en: "variance component"
    zh: "變異成分"
    note: "總變異中歸屬於某一來源（零件、機台、重複）的部分。"
    ex: "Part-to-part is the largest variance component, as it should be."
    ex_zh: "零件間是最大的變異成分，這是應有的結果。"
    tools: [mt]
  - en: "tool matching"
    zh: "機台匹配"
    note: "確認多台量測機台對同一晶圓給出一致結果。"
    ex: "Tool matching compares the same wafers and sites on two tools."
    ex_zh: "機台匹配在兩台機台上比較相同晶圓、相同量測點。"
    tools: [mt]
  - en: "chamber matching"
    zh: "腔體匹配"
    note: "確認同一機台不同腔體的製程結果一致。"
    ex: "Chamber matching revealed a 0.4 nm offset on chamber B."
    ex_zh: "腔體匹配發現 B 腔有 0.4 nm 的偏移。"
    tools: [mt, wl]
  - en: "offset"
    zh: "偏移量"
    note: "兩台機台或腔體之間的平均差異。"
    ex: "The mean offset of 0.10 nm is inside the 0.3 nm matching spec."
    ex_zh: "0.10 nm 的平均偏移量在 0.3 nm 的匹配規格內。"
    tools: [mt, wl]
  - en: "equivalence test"
    zh: "等效性檢定（TOST）"
    note: "雙單尾檢定：證明差異「小於規格」，而非只是「不顯著」。"
    ex: "A non-significant t-test does not prove matching; use an equivalence test."
    ex_zh: "t 檢定不顯著不代表匹配，應使用等效性檢定。"
    tools: [mt]
  - en: "Deming regression"
    zh: "戴明迴歸"
    note: "兩個變數都有量測誤差時使用的迴歸，比最小平方法無偏。"
    ex: "Deming regression gives an unbiased slope when both tools are noisy."
    ex_zh: "兩台機台都有雜訊時，戴明迴歸能給出無偏的斜率。"
    tools: [mt]
  - en: "Bland-Altman plot"
    zh: "Bland-Altman 圖（差異圖）"
    note: "以差值對平均值作圖，檢查兩種量測的一致性。"
    ex: "The Bland-Altman plot shows no trend in the difference across the range."
    ex_zh: "Bland-Altman 圖顯示差值在整個範圍內沒有趨勢。"
    tools: [mt]
  - en: "reference wafer"
    zh: "標準片"
    note: "膜厚已知且穩定的晶圓，用於校正與穩定性監控。"
    ex: "The reference wafer is measured twice a day on every tool."
    ex_zh: "每台機台每天量測標準片兩次。"
    tools: [mt]

  # ------------------------------------------------------------------ SPC
  - en: "statistical process control"
    zh: "統計製程管制（SPC）"
    note: "以統計方法監控製程是否處於管制狀態。"
    ex: "Statistical process control flags the shift within four wafers."
    ex_zh: "統計製程管制在四片之內就偵測到偏移。"
    tools: [mt, sy, wl, st]
  - en: "control chart"
    zh: "管制圖"
    note: "依時間序列繪製量測值與管制界限的圖。"
    ex: "Each chamber gets its own control chart and baseline."
    ex_zh: "每個腔體都有自己的管制圖與基準。"
    tools: [mt, sy, wl]
  - en: "control limits"
    zh: "管制界限（UCL／LCL）"
    note: "由製程本身變異算出的界限，與規格界限不同。"
    ex: "Control limits come from the process, not from the specification."
    ex_zh: "管制界限來自製程本身，而不是規格。"
    tools: [mt, sy, wl]
  - en: "specification limits"
    zh: "規格界限（USL／LSL）"
    note: "客戶或設計要求的上下限。"
    ex: "The specification limits are 98.5 and 101.5 nm."
    ex_zh: "規格界限為 98.5 與 101.5 nm。"
    tools: [mt, sy, wl]
  - en: "individuals and moving range chart"
    zh: "個別值-移動全距管制圖（I-MR）"
    note: "每次一個數據點時使用的管制圖。"
    ex: "The wafer mean is plotted on an individuals and moving range chart."
    ex_zh: "晶圓平均值繪在個別值-移動全距管制圖上。"
    tools: [mt, sy]
  - en: "Xbar-R chart"
    zh: "平均值-全距管制圖"
    note: "以子群平均與全距監控製程，子群大小 2–10。"
    ex: "The Xbar-R chart groups five consecutive wafers into one subgroup."
    ex_zh: "平均值-全距管制圖把連續五片晶圓分成一個子群。"
    tools: [mt, sy]
  - en: "EWMA chart"
    zh: "指數加權移動平均管制圖（EWMA）"
    note: "對小幅持續偏移比傳統管制圖更靈敏。"
    ex: "The EWMA chart detects a one-sigma shift much faster than rule 1."
    ex_zh: "EWMA 管制圖偵測一個標準差偏移的速度比法則一快得多。"
    tools: [mt, sy]
  - en: "CUSUM chart"
    zh: "累積和管制圖（CUSUM）"
    note: "累積偏離目標的量，適合偵測小偏移。"
    ex: "The CUSUM chart crosses the decision interval after a small sustained drift."
    ex_zh: "在小幅持續漂移之後，CUSUM 管制圖超出決策區間。"
    tools: [mt, sy]
  - en: "Western Electric rules"
    zh: "西方電氣法則（WE rules）"
    note: "判斷管制圖異常的規則，如一點超出 3σ、連續 8 點在同一側。"
    ex: "Western Electric rule 4 caught eight points in a row below the centre line."
    ex_zh: "西方電氣法則第 4 條抓到連續八點低於中心線。"
    tools: [mt, sy, wl]
  - en: "out of control"
    zh: "失控（超出管制）"
    note: "觸發管制圖規則的狀態，需調查原因。"
    ex: "An out-of-control point puts the chamber on hold."
    ex_zh: "一個失控點會讓腔體被暫停（hold）。"
    tools: [mt, sy, wl]
  - en: "Phase I"
    zh: "第一階段（建立基準）"
    note: "用穩定期資料計算管制界限的階段。"
    ex: "Limits are computed from the first twenty wafers in Phase I."
    ex_zh: "管制界限由第一階段的前二十片晶圓計算。"
    tools: [mt, wl]
  - en: "process capability"
    zh: "製程能力"
    note: "製程變異相對於規格寬度的能力，以 Cp/Cpk 表示。"
    ex: "Process capability is only meaningful for a process in control."
    ex_zh: "只有在製程受控時，製程能力才有意義。"
    tools: [mt, sy]
  - en: "Cpk"
    zh: "製程能力指標 Cpk"
    note: "考慮偏離中心的短期能力指標；≥ 1.33 常為最低要求。"
    ex: "Chamber DEP01-B has the lowest Cpk because its mean is off target."
    ex_zh: "DEP01-B 腔的 Cpk 最低，因為它的平均值偏離目標。"
    tools: [mt, sy]
  - en: "Ppk"
    zh: "製程績效指標 Ppk"
    note: "以整體（長期）標準差計算的能力指標。"
    ex: "Ppk is lower than Cpk when the process drifts between PMs."
    ex_zh: "製程在兩次 PM 之間漂移時，Ppk 會低於 Cpk。"
    tools: [mt, sy]
  - en: "short-term sigma"
    zh: "短期標準差"
    note: "由移動全距或子群內變異估計，不含漂移。"
    ex: "EWMA limits use short-term sigma so drift cannot widen them."
    ex_zh: "EWMA 界限使用短期標準差，因此漂移不會把界限撐寬。"
    tools: [mt, sy]
  - en: "average run length"
    zh: "平均連串長度（ARL）"
    note: "管制圖發出訊號前平均所需的點數。"
    ex: "A long in-control average run length means few false alarms."
    ex_zh: "受控時平均連串長度長，代表誤警報少。"
    tools: [mt]
  - en: "false alarm"
    zh: "誤警報"
    note: "製程正常卻觸發管制規則。"
    ex: "Tight limits on a very stable statistic produce occasional false alarms."
    ex_zh: "在非常穩定的統計量上設緊界限，偶爾會產生誤警報。"
    tools: [mt]
  - en: "drift"
    zh: "漂移"
    note: "隨時間緩慢變化的趨勢，如腔體老化。"
    ex: "Deposition rate drifts down with chamber age and resets at PM."
    ex_zh: "沉積速率隨腔體使用時間往下漂移，PM 後重置。"
    tools: [mt, sy, wl]
  - en: "excursion"
    zh: "製程異常（偏移事件）"
    note: "製程突然偏離正常狀態的事件，需快速偵測並找出原因。"
    ex: "The injected excursion is logged in a ground-truth table."
    ex_zh: "注入的製程異常會記錄在真值表中。"
    tools: [mt, wl]
  - en: "preventive maintenance"
    zh: "預防保養（PM）"
    note: "定期保養機台；常造成製程參數重置。"
    ex: "Thickness shows a saw-tooth pattern between preventive maintenance events."
    ex_zh: "膜厚在兩次預防保養之間呈現鋸齒狀變化。"
    tools: [mt, wl]
  - en: "chamber"
    zh: "腔體"
    note: "機台中實際進行製程的反應室；一台機台可有多個腔體。"
    ex: "Wafers alternate between chamber A and chamber B."
    ex_zh: "晶圓輪流進入 A 腔與 B 腔。"
    tools: [mt, wl]
  - en: "lot"
    zh: "批（lot）"
    note: "一起流動的一組晶圓，通常 25 片。"
    ex: "Five wafers per lot are sampled for metrology."
    ex_zh: "每批抽五片晶圓做量測。"
    tools: [mt, sy, wl]
  - en: "slot"
    zh: "槽位"
    note: "晶圓在晶舟或 FOUP 中的位置編號（1–25）。"
    ex: "Odd and even slots go to different chambers."
    ex_zh: "奇數與偶數槽位進入不同的腔體。"
    tools: [mt, wl]
  - en: "hold"
    zh: "暫停（hold）"
    note: "因異常把 lot 或機台暫停，待工程判定。"
    ex: "The lot went on hold after two points violated rule 2."
    ex_zh: "兩點違反法則 2 之後，這批被暫停。"
    tools: [wl]
  - en: "root cause analysis"
    zh: "根本原因分析"
    note: "找出異常真正來源的分析過程。"
    ex: "Root cause analysis traced the yield loss to one etch chamber."
    ex_zh: "根本原因分析把良率損失追溯到一個蝕刻腔體。"
    tools: [mt, wl]

  # ------------------------------------------------------------------ data / software
  - en: "long format"
    zh: "長表格格式"
    note: "每列一筆量測（一個量測點），方便各模組共用。"
    ex: "All measurements are converted to long format with one row per site."
    ex_zh: "所有量測都轉成每個量測點一列的長表格格式。"
    tools: [mt, wl]
  - en: "schema"
    zh: "資料結構定義（schema）"
    note: "欄位名稱、型別與關聯的規定。"
    ex: "Map your fab export to the standard schema once, in a loader."
    ex_zh: "在一個載入程式中，把廠內匯出資料一次對應到標準 schema。"
    tools: [mt, wl]
  - en: "synthetic data"
    zh: "合成資料"
    note: "以模擬產生、已知真值的資料，用於練習與驗證。"
    ex: "Synthetic data lets you score detection against a known truth."
    ex_zh: "合成資料讓你能以已知真值評估偵測效果。"
    tools: [mt, sy, wl]
  - en: "ground truth"
    zh: "真值（標準答案）"
    note: "已知正確的結果，用來評估演算法。"
    ex: "The simulator logs ground truth for every excursion it injects."
    ex_zh: "模擬器會記錄每個注入異常的真值。"
    tools: [mt, wl]
  - en: "environment variable"
    zh: "環境變數"
    note: "作業系統層級的設定，用來指定資料與設定檔路徑。"
    ex: "Point METRO_DATA_PATH to a folder outside the repository."
    ex_zh: "把 METRO_DATA_PATH 指向儲存庫以外的資料夾。"
    tools: [mt, wl]
  - en: "dashboard"
    zh: "儀表板"
    note: "互動式網頁，集中呈現圖表與指標。"
    ex: "Open the dashboard with streamlit run."
    ex_zh: "用 streamlit run 開啟儀表板。"
    tools: [mt, sy, wl, st]
  - en: "unit test"
    zh: "單元測試"
    note: "自動檢查程式小單元是否正確。"
    ex: "Unit tests compare the optics against analytic limits."
    ex_zh: "單元測試把光學計算與解析極限做比對。"
    tools: [mt, sy, wl]
  - en: "virtual environment"
    zh: "虛擬環境"
    note: "專案專用的 Python 套件環境，避免版本衝突。"
    ex: "Activate the virtual environment before installing the toolkit."
    ex_zh: "安裝工具箱之前先啟用虛擬環境。"
    tools: [mt, sy]
  - en: "editable install"
    zh: "可編輯安裝（pip install -e）"
    note: "套件直接指向原始碼，修改後立即生效。"
    ex: "An editable install is required so the config folder can be found."
    ex_zh: "需要可編輯安裝，程式才能找到 config 資料夾。"
    tools: [mt, sy]
  - en: "license"
    zh: "授權條款"
    note: "規定他人可否使用、修改、散布程式碼；沒有授權即保留所有權利。"
    ex: "Without a license file you may read the code but not reuse it."
    ex_zh: "沒有授權檔時，你可以閱讀程式碼，但不能重複使用。"
    tools: [mt, sy, wl, st]
  - en: "attribution"
    zh: "出處標示"
    note: "使用他人 MIT 等授權程式碼時保留版權與授權聲明。"
    ex: "The adapted SPC module keeps SemiYield's attribution in NOTICE.md."
    ex_zh: "改寫的 SPC 模組在 NOTICE.md 中保留 SemiYield 的出處標示。"
    tools: [mt, sy]

  # ------------------------------------------------------------------ WaferLens (fab data platform)
  - en: "data pipeline"
    zh: "資料管線"
    note: "資料從產生、驗證、載入到分析的自動化流程。"
    ex: "The data pipeline simulates, validates, and loads six months of fab data."
    ex_zh: "資料管線模擬、驗證並載入六個月的晶圓廠資料。"
    tools: [wl]
  - en: "wafer genealogy"
    zh: "晶圓履歷"
    note: "每片晶圓經過哪些機台、腔體、時間的完整紀錄。"
    ex: "Chamber-level wafer genealogy makes commonality analysis possible."
    ex_zh: "腔體層級的晶圓履歷讓共通性分析成為可能。"
    tools: [wl]
  - en: "commonality analysis"
    zh: "共通性分析"
    note: "找出低良率晶圓共同經過的機台或腔體。"
    ex: "Commonality analysis points to the chamber shared by most failing wafers."
    ex_zh: "共通性分析指向大多數失效晶圓共同經過的腔體。"
    tools: [wl]
  - en: "yield"
    zh: "良率"
    note: "合格晶粒佔總晶粒的比例。"
    ex: "Weekly yield dropped after the recipe change."
    ex_zh: "Recipe 變更後每週良率下降。"
    tools: [sy, wl, st]
  - en: "sort bin"
    zh: "電測分類（bin）"
    note: "晶圓電性測試後依失效類型給的分類代碼。"
    ex: "Leakage failures are reported in sort bin 3."
    ex_zh: "漏電失效歸在電測分類 bin 3。"
    tools: [wl, st]
  - en: "defect density"
    zh: "缺陷密度（D0）"
    note: "單位面積的致命缺陷數，常用 defects/cm²。"
    ex: "A higher defect density at the edge lowers edge-die yield."
    ex_zh: "邊緣較高的缺陷密度降低了邊緣晶粒的良率。"
    tools: [sy, wl]
  - en: "technology node"
    zh: "技術節點"
    note: "製程世代，如 28 nm、1-gamma。"
    ex: "Metrology targets are scaled for each technology node."
    ex_zh: "量測目標值會依技術節點縮放。"
    tools: [wl, sy]
  - en: "process step"
    zh: "製程站點（步驟）"
    note: "製程流程中的一個步驟，例如 poly_dep、sti_cmp。"
    ex: "Metrology is attached to the process step it follows."
    ex_zh: "量測資料掛在它之後的製程站點上。"
    tools: [mt, wl]
  - en: "process route"
    zh: "製程流程（route）"
    note: "產品依序經過的所有製程步驟。"
    ex: "Every product runs its own version of the process route."
    ex_zh: "每個產品都跑自己版本的製程流程。"
    tools: [wl]
  - en: "critical dimension"
    zh: "關鍵尺寸（CD）"
    note: "圖形中最重要的線寬或孔徑。"
    ex: "Critical dimension after etch is slightly smaller than after litho."
    ex_zh: "蝕刻後的關鍵尺寸比微影後稍小。"
    tools: [wl, mt]
  - en: "overlay"
    zh: "疊對"
    note: "上下兩層圖形之間的對準誤差。"
    ex: "Overlay x and y are correlated in the simulated litho step."
    ex_zh: "在模擬的微影站中，疊對的 x 與 y 彼此相關。"
    tools: [wl, mt]
  - en: "sheet resistance"
    zh: "片電阻"
    note: "薄導電層的電阻，單位 Ω/□。"
    ex: "Sheet resistance is measured after the source-drain anneal."
    ex_zh: "片電阻在源汲極退火之後量測。"
    tools: [wl]
  - en: "dishing"
    zh: "碟化"
    note: "CMP 後寬圖形中央凹陷的現象。"
    ex: "Dishing increases when oxide thickness after CMP is low."
    ex_zh: "CMP 後氧化層較薄時，碟化會增加。"
    tools: [wl]
  - en: "trench depth"
    zh: "溝槽深度"
    note: "蝕刻溝槽的深度，例如 STI。"
    ex: "Trench depth is shallower at the edge in the STI etch."
    ex_zh: "在 STI 蝕刻中，邊緣的溝槽深度較淺。"
    tools: [wl]
  - en: "sidewall angle"
    zh: "側壁角"
    note: "蝕刻輪廓側壁與水平面的夾角。"
    ex: "A sidewall angle of 88 degrees is the gate etch target."
    ex_zh: "閘極蝕刻的目標側壁角為 88 度。"
    tools: [wl]
  - en: "sensor"
    zh: "感測器（機台參數）"
    note: "機台回報的製程參數，如 RF 功率、壓力、溫度。"
    ex: "The tool's primary sensor couples into the first metrology parameter."
    ex_zh: "機台的主要感測器參數會影響第一個量測參數。"
    tools: [wl, st]
  - en: "fault detection and classification"
    zh: "故障偵測與分類（FDC）"
    note: "以機台感測器資料即時偵測異常並分類。"
    ex: "Fault detection and classification uses hundreds of sensor readings per wafer."
    ex_zh: "故障偵測與分類每片晶圓使用數百個感測器讀值。"
    tools: [wl, st]
  - en: "rework"
    zh: "重工"
    note: "不合格（多為微影）時去除後重做。"
    ex: "Litho rework adds a two-hour delay to the lot."
    ex_zh: "微影重工會讓這批延遲兩小時。"
    tools: [wl]
  - en: "scrap"
    zh: "報廢"
    note: "晶圓無法修復而被丟棄。"
    ex: "A scrapped wafer disappears from all later process steps."
    ex_zh: "報廢的晶圓不會出現在之後的任何製程站點。"
    tools: [wl]
  - en: "split lot"
    zh: "分批（split）"
    note: "一批晶圓被拆成子批，常用於實驗。"
    ex: "In a split lot, slots 13 to 25 become a child lot."
    ex_zh: "分批時，槽位 13 到 25 變成子批。"
    tools: [wl]
  - en: "queue time"
    zh: "等候時間（Q-time）"
    note: "晶圓在兩站之間等待的時間，過長可能影響品質。"
    ex: "Queue time between steps follows an exponential distribution in the simulator."
    ex_zh: "模擬器中站與站之間的等候時間服從指數分布。"
    tools: [wl]
  - en: "time-series database"
    zh: "時間序列資料庫"
    note: "專為時間戳記資料優化的資料庫，如 TimescaleDB。"
    ex: "Sensor data is stored in a time-series database."
    ex_zh: "感測器資料存放在時間序列資料庫中。"
    tools: [wl]
  - en: "database migration"
    zh: "資料庫遷移"
    note: "以版本化腳本建立或修改資料表結構（如 Alembic）。"
    ex: "Run the database migration before loading any data."
    ex_zh: "載入任何資料之前，先執行資料庫遷移。"
    tools: [wl]
  - en: "star schema"
    zh: "星型綱要"
    note: "以事實表為中心、周圍連接維度表的資料倉儲結構。"
    ex: "The star schema separates measurement facts from tool dimensions."
    ex_zh: "星型綱要把量測事實與機台維度分開。"
    tools: [wl]
  - en: "orchestration"
    zh: "流程編排"
    note: "自動排程與串接多個資料處理工作（如 Dagster）。"
    ex: "Orchestration runs simulate, load, and transform as one job."
    ex_zh: "流程編排把模擬、載入與轉換當成一個工作執行。"
    tools: [wl]
  - en: "Hotelling T-squared"
    zh: "Hotelling T² 統計量"
    note: "多變量管制統計量，同時監控多個相關參數。"
    ex: "Hotelling T-squared watches thickness and refractive index together."
    ex_zh: "Hotelling T² 同時監控膜厚與折射率。"
    tools: [wl]
  - en: "container"
    zh: "容器（Docker）"
    note: "打包好的執行環境，如資料庫服務。"
    ex: "The database runs in a Docker container on port 5432."
    ex_zh: "資料庫在 5432 埠的 Docker 容器中執行。"
    tools: [wl]

  # ------------------------------------------------------------------ SemiYield (process / DOE / yield)
  - en: "process simulation"
    zh: "製程模擬"
    note: "以物理模型預測氧化、沉積、蝕刻、植入的結果。"
    ex: "Process simulation predicts oxide thickness from time and temperature."
    ex_zh: "製程模擬由時間與溫度預測氧化層厚度。"
    tools: [sy]
  - en: "thermal oxidation"
    zh: "熱氧化"
    note: "在高溫氧氣或水氣中成長 SiO2；常用 Deal-Grove 模型。"
    ex: "Thermal oxidation follows the Deal-Grove linear-parabolic model."
    ex_zh: "熱氧化遵循 Deal-Grove 線性-拋物線模型。"
    tools: [sy]
  - en: "chemical vapor deposition"
    zh: "化學氣相沉積（CVD）"
    note: "以氣體前驅物反應沉積薄膜。"
    ex: "Chemical vapor deposition rate rises exponentially with temperature."
    ex_zh: "化學氣相沉積速率隨溫度呈指數上升。"
    tools: [sy, st, wl]
  - en: "PECVD"
    zh: "電漿輔助化學氣相沉積"
    note: "以電漿降低反應溫度的 CVD。"
    ex: "PECVD nitride is deposited at 250 to 350 degrees Celsius."
    ex_zh: "PECVD 氮化矽在攝氏 250 到 350 度之間沉積。"
    tools: [sy, st]
  - en: "atomic layer deposition"
    zh: "原子層沉積（ALD）"
    note: "以自我限制反應逐層沉積，厚度以循環數控制，覆蓋性極佳。"
    ex: "Atomic layer deposition adds about 0.1 nm per cycle."
    ex_zh: "原子層沉積每個循環約增加 0.1 nm。"
    tools: [sy, mt, st]
  - en: "physical vapor deposition"
    zh: "物理氣相沉積（PVD）"
    note: "以濺鍍等物理方式沉積金屬，方向性強。"
    ex: "Physical vapor deposition has poor step coverage in deep trenches."
    ex_zh: "物理氣相沉積在深溝槽中的階梯覆蓋率很差。"
    tools: [sy, wl]
  - en: "ion implantation"
    zh: "離子植入"
    note: "以加速離子將摻雜物打入矽中。"
    ex: "Ion implantation dose is set in ions per square centimetre."
    ex_zh: "離子植入劑量以每平方公分的離子數設定。"
    tools: [sy, wl]
  - en: "etching"
    zh: "蝕刻"
    note: "以化學或電漿去除材料形成圖形。"
    ex: "Etching selectivity determines how much of the mask survives."
    ex_zh: "蝕刻選擇比決定遮罩能保留多少。"
    tools: [sy, wl]
  - en: "chemical mechanical polishing"
    zh: "化學機械研磨（CMP）"
    note: "以研磨液與研磨墊平坦化表面。"
    ex: "Chemical mechanical polishing removes less material at the wafer edge."
    ex_zh: "化學機械研磨在晶圓邊緣移除的材料較少。"
    tools: [wl, sy]
  - en: "deposition rate"
    zh: "沉積速率"
    note: "單位時間沉積的厚度，nm/min。"
    ex: "The optimal recipe reaches a deposition rate of 62 nm per minute."
    ex_zh: "最佳 recipe 達到每分鐘 62 nm 的沉積速率。"
    tools: [sy, st, mt]
  - en: "activation energy"
    zh: "活化能"
    note: "Arrhenius 關係中決定溫度敏感度的參數。"
    ex: "A higher activation energy makes the rate more sensitive to temperature."
    ex_zh: "活化能越高，速率對溫度越敏感。"
    tools: [sy]
  - en: "step coverage"
    zh: "階梯覆蓋率"
    note: "溝槽側壁或底部膜厚與表面膜厚之比。"
    ex: "ALD keeps step coverage near 100 percent even at high aspect ratio."
    ex_zh: "即使在高深寬比下，ALD 的階梯覆蓋率仍接近 100%。"
    tools: [sy]
  - en: "aspect ratio"
    zh: "深寬比"
    note: "結構深度與寬度之比。"
    ex: "Step coverage falls as the aspect ratio increases."
    ex_zh: "深寬比越大，階梯覆蓋率越低。"
    tools: [sy, mt]
  - en: "film stress"
    zh: "薄膜應力"
    note: "薄膜內的張應力或壓應力，會造成晶圓翹曲。"
    ex: "Film stress combines intrinsic stress and thermal mismatch."
    ex_zh: "薄膜應力包含本質應力與熱膨脹不匹配。"
    tools: [sy, st]
  - en: "design of experiments"
    zh: "實驗設計（DOE）"
    note: "有系統地改變因子，以最少實驗找出因子效應。"
    ex: "Design of experiments links recipe parameters to thickness and uniformity."
    ex_zh: "實驗設計把 recipe 參數與膜厚、均勻性連結起來。"
    tools: [sy, st, mt]
  - en: "process window"
    zh: "製程窗口"
    note: "所有輸出都符合規格的參數範圍。"
    ex: "The process window shrinks when the uniformity spec is tightened."
    ex_zh: "均勻性規格收緊時，製程窗口會縮小。"
    tools: [sy, st]
  - en: "Bayesian optimization"
    zh: "貝氏最佳化"
    note: "以代理模型與取樣策略，用少量實驗找到最佳條件。"
    ex: "Bayesian optimization suggests the next recipe to try."
    ex_zh: "貝氏最佳化會建議下一組要嘗試的 recipe。"
    tools: [sy]
  - en: "Gaussian process"
    zh: "高斯過程"
    note: "可同時給出預測值與不確定度的代理模型。"
    ex: "The Gaussian process predicts both the response and its uncertainty."
    ex_zh: "高斯過程同時預測響應值與其不確定度。"
    tools: [sy]
  - en: "expected improvement"
    zh: "期望改善量（EI）"
    note: "貝氏最佳化中選下一個實驗點的準則。"
    ex: "Expected improvement balances exploring new regions and refining good ones."
    ex_zh: "期望改善量在探索新區域與精修好區域之間取得平衡。"
    tools: [sy]
  - en: "Latin hypercube sampling"
    zh: "拉丁超立方抽樣"
    note: "讓樣本均勻散佈於多維空間的抽樣法。"
    ex: "The first ten runs use Latin hypercube sampling."
    ex_zh: "前十次實驗使用拉丁超立方抽樣。"
    tools: [sy]
  - en: "yield model"
    zh: "良率模型"
    note: "由缺陷密度與晶粒面積預測良率，如 Murphy、Poisson 模型。"
    ex: "The Murphy yield model links defect density to die yield."
    ex_zh: "Murphy 良率模型把缺陷密度與晶粒良率連結起來。"
    tools: [sy]
  - en: "ensemble model"
    zh: "集成模型"
    note: "結合多個機器學習模型以提高預測準確度。"
    ex: "The ensemble model combines gradient boosting and a neural network."
    ex_zh: "集成模型結合了梯度提升與神經網路。"
    tools: [sy]
  - en: "explainability"
    zh: "可解釋性"
    note: "說明模型為何做出某預測，如 SHAP 值。"
    ex: "SHAP explainability ranks which process parameters drive yield."
    ex_zh: "SHAP 可解釋性排出哪些製程參數影響良率最大。"
    tools: [sy, st]
  - en: "SPICE netlist"
    zh: "SPICE 網表"
    note: "描述電路元件與連接的文字檔，用於電路模擬。"
    ex: "Extracted device parameters are exported as a SPICE netlist."
    ex_zh: "萃取的元件參數匯出為 SPICE 網表。"
    tools: [sy]

  # ------------------------------------------------------------------ sem-toolkit (ML / wafer map / DOE)
  - en: "class imbalance"
    zh: "類別不平衡"
    note: "某一類樣本遠少於其他類，如失效晶圓只佔少數。"
    ex: "SECOM has a 14 to 1 class imbalance between pass and fail."
    ex_zh: "SECOM 的合格與失效之間有 14 比 1 的類別不平衡。"
    tools: [st]
  - en: "oversampling"
    zh: "過採樣（如 SMOTE）"
    note: "合成或複製少數類樣本以平衡資料。"
    ex: "Oversampling is applied to the training set only, never to the test set."
    ex_zh: "過採樣只用在訓練集，絕不用在測試集。"
    tools: [st]
  - en: "feature selection"
    zh: "特徵選擇"
    note: "去除無資訊或缺值過多的變數。"
    ex: "Feature selection kept 442 of the 591 sensors."
    ex_zh: "特徵選擇保留了 591 個感測器中的 442 個。"
    tools: [st]
  - en: "random forest"
    zh: "隨機森林"
    note: "由多棵決策樹投票的分類／迴歸模型。"
    ex: "A random forest classifies wafers as pass or fail from sensor data."
    ex_zh: "隨機森林以感測器資料把晶圓分為合格或失效。"
    tools: [st]
  - en: "convolutional neural network"
    zh: "卷積神經網路（CNN）"
    note: "擅長影像辨識的深度學習模型。"
    ex: "A convolutional neural network classifies wafer-map defect patterns."
    ex_zh: "卷積神經網路對晶圓圖缺陷圖樣進行分類。"
    tools: [st]
  - en: "defect pattern"
    zh: "缺陷圖樣"
    note: "晶圓圖上失效晶粒的空間分布型態，如 Center、Edge-Ring、Scratch。"
    ex: "An edge-ring defect pattern often points to deposition edge effects."
    ex_zh: "邊緣環狀缺陷圖樣常指向沉積的邊緣效應。"
    tools: [st, wl]
  - en: "scratch"
    zh: "刮傷"
    note: "線狀缺陷圖樣，多與晶圓搬運或 CMP 有關。"
    ex: "A scratch pattern runs in a straight line across several dies."
    ex_zh: "刮傷圖樣以直線橫跨數顆晶粒。"
    tools: [st, wl]
  - en: "Grad-CAM"
    zh: "Grad-CAM（梯度加權類別活化圖）"
    note: "顯示 CNN 判斷時關注影像哪個區域。"
    ex: "Grad-CAM confirms the model looks at the wafer edge for edge-ring maps."
    ex_zh: "Grad-CAM 確認模型在判斷邊緣環圖樣時看的是晶圓邊緣。"
    tools: [st]
  - en: "confusion matrix"
    zh: "混淆矩陣"
    note: "列出實際類別與預測類別對照的表格。"
    ex: "The confusion matrix shows Loc and Edge-Loc are often confused."
    ex_zh: "混淆矩陣顯示 Loc 與 Edge-Loc 常被混淆。"
    tools: [st]
  - en: "full factorial design"
    zh: "全因子設計"
    note: "所有因子所有水準組合都做實驗；2⁴ 為 16 組。"
    ex: "A 2-to-the-4 full factorial design with four center points needs 20 runs."
    ex_zh: "2⁴ 全因子設計加四個中心點需要 20 次實驗。"
    tools: [st, sy]
  - en: "center point"
    zh: "中心點"
    note: "因子皆在中間水準的實驗，用於檢查曲率與估計誤差。"
    ex: "Center points reveal curvature that a two-level design would miss."
    ex_zh: "中心點能發現二水準設計會漏掉的曲率。"
    tools: [st, sy]
  - en: "response surface"
    zh: "反應曲面"
    note: "以二次模型描述輸出隨因子變化的曲面。"
    ex: "The response surface shows deposition rate rising with RF power."
    ex_zh: "反應曲面顯示沉積速率隨射頻功率上升。"
    tools: [st, sy, mt]
  - en: "desirability function"
    zh: "滿意度函數"
    note: "把多個響應合併成單一 0–1 分數，以進行多目標最佳化。"
    ex: "The desirability function trades deposition rate against film stress."
    ex_zh: "滿意度函數在沉積速率與薄膜應力之間取捨。"
    tools: [st]
  - en: "RF power"
    zh: "射頻功率"
    note: "電漿製程中供給的射頻功率，影響沉積與蝕刻速率。"
    ex: "Raising RF power increases PECVD deposition rate."
    ex_zh: "提高射頻功率會增加 PECVD 沉積速率。"
    tools: [st, sy, wl]
  - en: "precursor"
    zh: "前驅物"
    note: "CVD/ALD 中提供元素的反應氣體，如 SiH4、TMA。"
    ex: "SiH4 is the silicon precursor for PECVD nitride."
    ex_zh: "SiH4 是 PECVD 氮化矽的矽前驅物。"
    tools: [st, sy]
  - en: "passivation layer"
    zh: "保護層（鈍化層）"
    note: "保護元件免受濕氣與污染的最上層薄膜。"
    ex: "Silicon nitride is a common passivation layer."
    ex_zh: "氮化矽是常見的保護層。"
    tools: [st]
  - en: "diffusion barrier"
    zh: "擴散阻障層"
    note: "防止金屬擴散進介電質的薄層，如 TiN。"
    ex: "TiN acts as a diffusion barrier under tungsten."
    ex_zh: "TiN 在鎢下方作為擴散阻障層。"
    tools: [st]
